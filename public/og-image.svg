<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Wireline. Bots That Get the Work Done.</title>
  <desc id="desc">Voice-first Bots for calls, live conversations, text, and email in one workspace.</desc>
  <defs>
    <radialGradient id="bg-glow" cx="78%" cy="20%" r="68%">
      <stop offset="0" stop-color="#3B1C73" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#191226" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A0A0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="card-surface" cx="42%" cy="24%" r="78%">
      <stop offset="0" stop-color="#201B2B"/>
      <stop offset="0.58" stop-color="#0E0D13"/>
      <stop offset="1" stop-color="#07070A"/>
    </radialGradient>
    <linearGradient id="card-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.56" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="purple-down" x1="14" y1="14" x2="68" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8B5FF"/>
      <stop offset="0.38" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5221D6"/>
    </linearGradient>
    <linearGradient id="purple-up" x1="42" y1="106" x2="100" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B24E8"/>
      <stop offset="0.55" stop-color="#7040F2"/>
      <stop offset="1" stop-color="#B69AFF"/>
    </linearGradient>
    <linearGradient id="fold" x1="76" y1="14" x2="132" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F2B3D"/>
      <stop offset="0.46" stop-color="#625D72"/>
      <stop offset="1" stop-color="#C8CAD4"/>
    </linearGradient>
    <linearGradient id="silver" x1="108" y1="106" x2="166" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BCC0CB"/>
      <stop offset="0.48" stop-color="#E4E6ED"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#C7CCD6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C7CCD6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0E"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <path d="M0 108H1200M0 534H1200" stroke="#25222E" stroke-width="1"/>

  <g transform="translate(68 46) scale(0.54)">
    <path d="M76 14H100L132 106H108Z" fill="url(#fold)"/>
    <path d="M14 14H40L68 106H42Z" fill="url(#purple-down)"/>
    <path d="M42 106H68L100 14H74Z" fill="url(#purple-up)"/>
    <path d="M108 106H134L166 14H140Z" fill="url(#silver)"/>
  </g>
  <text x="174" y="84" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="1" fill="#F5F4F8">Wireline</text>

  <text x="70" y="200" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="4" fill="#A78BFA">VOICE-FIRST / CALLS / LIVE CONVERSATIONS / TEXT / EMAIL</text>
  <text x="68" y="306" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F5F4F8">BOTS THAT GET</text>
  <text x="68" y="392" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F5F4F8">THE WORK DONE</text>
  <text x="72" y="438" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#B6B1C6">Answer and make calls. Continue by text and email.</text>
  <text x="72" y="472" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#B6B1C6">Book next steps, follow through, and log the outcome.</text>
  <rect x="70" y="506" width="590" height="2" rx="1" fill="url(#rule)"/>
  <text x="70" y="572" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="3.4" fill="#A78BFA">ONE WORKSPACE / TRYWIRELINE.COM</text>

  <g transform="translate(842 150)">
    <rect width="288" height="288" rx="68" fill="url(#card-surface)" stroke="url(#card-edge)" stroke-width="4"/>
    <g transform="translate(11 71) scale(1.48)">
      <path d="M76 14H100L132 106H108Z" fill="url(#fold)"/>
      <path d="M14 14H40L68 106H42Z" fill="url(#purple-down)"/>
      <path d="M42 106H68L100 14H74Z" fill="url(#purple-up)"/>
      <path d="M108 106H134L166 14H140Z" fill="url(#silver)"/>
    </g>
  </g>
  <g transform="translate(842 465)">
    <rect width="288" height="46" rx="23" fill="#17131F" stroke="#2C2440"/>
    <circle cx="26" cy="23" r="6" fill="#4ADE9A"/>
    <text x="46" y="29" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="1.3" fill="#C4B5FD">VOICE / TEXT / EMAIL</text>
  </g>
</svg>
