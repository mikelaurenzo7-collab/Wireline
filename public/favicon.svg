      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.75" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.8"/>
