<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireline Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="./tokens.generated.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./command.css" />
    <link rel="stylesheet" href="./app-signature.css" />
  </head>
  <body>
    <main class="panel-shell">
      <header class="panel-header panel-hero">
        <div class="wordmark" aria-label="Wireline">WIRELINE</div>
        <p>Command your agent from any page. Wireline answers while you stay focused.</p>
      </header>

      <section class="context-card" aria-labelledby="page-context-title">
        <div class="section-heading">
          <span>Current page</span>
          <button id="refresh-context" class="quiet-button" type="button">Refresh</button>
        </div>
        <h1 id="page-context-title">Loading page context...</h1>
        <p id="page-host" class="muted">Only this tab is inspected when you ask.</p>
        <p id="selection-preview" class="selection-preview" hidden></p>
      </section>

      <section class="quick-actions" aria-label="Quick commands">
        <button class="quick-action" type="button" data-action="call">Call</button>
        <button class="quick-action" type="button" data-action="text">Text</button>
        <button class="quick-action" type="button" data-action="followup">Follow-up</button>
        <button class="quick-action" type="button" data-action="task">Agent task</button>
      </section>

      <form id="handoff-form" class="handoff-form">
        <label for="request">What should Wireline do?</label>
        <textarea
          id="request"
          rows="5"
          maxlength="800"
          placeholder="Example: have an agent call this business, ask about availability, then create a follow-up."
        ></textarea>
        <p class="privacy-note">
          Page title, URL, description, and explicit selection are included only when you choose
          <strong>Send to Studio</strong>.
        </p>
        <button id="handoff-button" class="primary-button" type="submit">Send to Studio</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <footer class="panel-footer">
        <button id="open-agents" class="text-button" type="button">Agents</button>
        <span aria-hidden="true">·</span>
        <button id="open-wire" class="text-button" type="button">Integrations</button>
        <span aria-hidden="true">·</span>
        <button id="open-billing" class="text-button" type="button">Usage</button>
        <span aria-hidden="true">·</span>
        <button id="open-studio" class="text-button" type="button">Studio</button>
        <span aria-hidden="true">·</span>
        <a href="https://trywireline.com/privacy" target="_blank" rel="noreferrer">Privacy</a>
      </footer>
    </main>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
