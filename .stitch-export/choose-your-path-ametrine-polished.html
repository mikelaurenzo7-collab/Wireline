<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        .subtle-shadow-hover:hover {
            box-shadow: 0px 12px 32px rgba(15, 23, 42, 0.08);
            transform: translateY(-2px);
        }

        .bg-mesh {
            background-color: #f9f9ff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(226,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(227,100%,94%,1) 0px, transparent 50%);
        }
    </style>

<body class="bg-mesh text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container font-sans">
<main class="flex-grow flex flex-col items-center justify-center p-6 md:p-12 relative z-10 w-full max-w-container-max mx-auto">
<header class="mb-12 text-center max-w-2xl mx-auto">
<div class="mb-6 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    target
                </span>
<h1 class="font-headline-md text-headline-md font-black text-on-background tracking-tight">Wireline</h1>
</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-4">Select your workspace</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Choose the environment that best fits your workflow. You can easily create additional workspaces later.
            </p>
</header>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
<button class="group relative flex flex-col text-left h-full bg-surface-container-lowest border border-outline-variant rounded p-8 transition-all duration-300 subtle-shadow-hover hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed rounded-bl-full opacity-20 transform translate-x-8 -translate-y-8 group-hover:scale-110 transition-transform duration-500 ease-out"></div>
<div class="mb-6 inline-flex items-center justify-center w-14 h-14 rounded bg-surface-container-low text-primary border border-outline-variant group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300">
<span class="material-symbols-outlined text-3xl">person</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-3 group-hover:text-primary transition-colors">Personal</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 flex-grow">
                    Designed for busy professionals. Manage your personal life, households, side projects, and individual knowledge base with streamlined tools.
                </p>
<div class="flex items-center text-primary font-title-md text-title-md mt-auto">
<span>Start Personal</span>
<span class="material-symbols-outlined ml-2 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
<button class="group relative flex flex-col text-left h-full bg-surface-container-lowest border border-outline-variant rounded p-8 transition-all duration-300 subtle-shadow-hover hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed rounded-bl-full opacity-20 transform translate-x-8 -translate-y-8 group-hover:scale-110 transition-transform duration-500 ease-out"></div>
<div class="mb-6 inline-flex items-center justify-center w-14 h-14 rounded bg-surface-container-low text-primary border border-outline-variant group-hover:bg-primary group-hover:text-on-primary transition-colors duration-300">
<span class="material-symbols-outlined text-3xl">domain</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-3 group-hover:text-primary transition-colors">Business</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 flex-grow">
                    Built for SME owners and teams. Optimize operations, manage collective knowledge, and scale workflows with enterprise-grade features.
                </p>
<div class="flex items-center text-primary font-title-md text-title-md mt-auto">
<span>Start Business</span>
<span class="material-symbols-outlined ml-2 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
</div>
<div class="mt-12 text-center">
<p class="font-body-md text-body-md text-outline">
                Need help deciding? <a class="text-primary hover:underline font-title-md text-title-md" href="#">Compare features</a>
</p>
</div>
</main>
