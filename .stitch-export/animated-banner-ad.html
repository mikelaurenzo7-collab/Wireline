<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_91');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

float network(vec2 uv, float t) {
    float d = 0.0;
    for(float i=0.0; i<8.0; i++) {
        vec2 p = vec2(sin(i * 1.5 + t), cos(i * 2.1 + t * 0.7));
        d += 0.002 / distance(uv, p * 0.5 + 0.5);
    }
    return d;
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    float t = u_time * 0.8;
    
    float pulse = network(uv, t);
    pulse += network(uv * 1.2, t * 0.5) * 0.5;
    
    vec3 baseColor = vec3(0.365, 0.247, 0.827); // #5d3fd3
    vec3 color = baseColor * pulse;
    color += baseColor * 0.1; // Ambient glow
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        // Simple Vanilla JS Parallax Effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('parallax-container');
            const laptop = document.getElementById('laptop-image');
            const layers = document.querySelectorAll('.parallax-layer');

            if (!container || !laptop) return;

            // Only activate on desktop where mouse movement makes sense
            if (window.matchMedia("(min-width: 768px)").matches) {
                
                // Add floating animation baseline
                laptop.style.animation = 'float 6s ease-in-out infinite';
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes float {
                        0% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
                        50% { transform: translateY(-20px) rotateX(2deg) rotateY(-2deg); }
                        100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
                    }
                `;
                document.head.appendChild(style);

                // Mouse move parallax override
                document.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 50;

                    // Pause default float animation slightly when interacting
                    laptop.style.animationPlayState = 'paused';
                    
                    laptop.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateZ(50px)`;
                    
                    layers.forEach(layer => {
                        if(layer !== laptop) {
                            const speed = layer.getAttribute('data-speed') || 0.05;
                            const x = (window.innerWidth - e.pageX * speed) / 100;
                            const y = (window.innerHeight - e.pageY * speed) / 100;
                            
                            // Keep existing rotations if present
                            const currentTransform = layer.style.transform;
                            const rotateMatches = currentTransform.match(/rotate[XY]\([^)]+\)/g) || [];
                            const rotations = rotateMatches.join(' ');
                            
                            layer.style.transform = `translateX(${x}px) translateY(${y}px) ${rotations}`;
                        }
                    });
                });

                document.addEventListener('mouseleave', () => {
                    laptop.style.animationPlayState = 'running';
                    laptop.style.transform = `rotateY(-5deg) rotateX(5deg) translateZ(0px)`;
                    
                     layers.forEach(layer => {
                        if(layer !== laptop) {
                             const currentTransform = layer.style.transform;
                             const rotateMatches = currentTransform.match(/rotate[XY]\([^)]+\)/g) || [];
                             const rotations = rotateMatches.join(' ');
                             layer.style.transform = `translateX(0px) translateY(0px) ${rotations}`;
                        }
                     });
                });
            }
        });
    </script>
