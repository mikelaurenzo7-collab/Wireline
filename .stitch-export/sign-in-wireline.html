<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign in to Wireline</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface": "#f9f9f7",
                        "ink-slate": "#6E6E73",

                        "tertiary": "#361812",
                        "primary-fixed-dim": "#aacec3",
                        "surface-container-high": "#e8e8e6",
                        "on-secondary-fixed": "#1b1b20",
                        "inverse-on-surface": "#f1f1ef",
                        "tertiary-fixed": "#ffdad3",
                        "accent-forest": "#1A3C34",
                        "surface-dim": "#dadad8",
                        "on-tertiary-container": "#c4948a",
                        "primary-fixed": "#c5eadf",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f7",
                        "secondary-container": "#e3e1e9",
                        "on-surface-variant": "#414846",
                        "on-surface": "#1a1c1b",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#1a3c34",
                        "on-tertiary-fixed-variant": "#623d36",
                        "inverse-primary": "#aacec3",
                        "tertiary-container": "#4f2d26",
                        "surface-container": "#eeeeec",
                        "primary": "#01261f",
                        "tertiary-fixed-dim": "#efbab0",
                        "surface-tint": "#43655c",
                        "inverse-surface": "#2f3130",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#64646a",
                        "status-warning": "#B45309",
                        "ink-charcoal": "#1D1D1F",
                        "outline-variant": "#c1c8c4",

                        "error-container": "#ffdad6",
                        "surface-cream": "#F7F7F5",

                        "border-subtle": "#E5E5E1",
                        "on-primary-container": "#83a69c",
                        "outline": "#717976",
                        "secondary": "#5e5e64",
                        "on-secondary-fixed-variant": "#46464c",
                        "on-primary-fixed": "#00201a",
                        "on-background": "#1a1c1b",
                        "surface-container-low": "#f4f4f2",
                        "secondary-fixed-dim": "#c7c5cd",
                        "status-active": "#2D5A27",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container_margin": "24px",
                        "gutter": "16px",
                        "stack_lg": "16px",
                        "sidebar_width": "212px",
                        "stack_sm": "4px",
                        "stack_md": "8px"
                    },
                    "fontFamily": {
                        "mono-ui": ["JetBrains Mono"],
                        "headline-xl": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],

                        "label-caps": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "mono-ui": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],

                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "600"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]

            }
        }

</head>
<body class="bg-surface-container-low text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- Auth Container -->
<main class="flex-grow flex items-center justify-center p-container_margin">
<div class="w-full max-w-[440px]">
<!-- Logo & Header -->
<div class="text-center mb-stack_lg">
<div class="text-accent-forest font-headline-xl text-headline-xl mb-stack_sm">Wireline</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary mt-stack_sm">Sign in to manage your AI fleet.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-white border border-border-subtle rounded-lg p-[32px]">
<!-- OAuth Buttons -->
<div class="space-y-[12px]">
<button class="w-full flex items-center justify-center gap-[12px] px-[12px] py-[10px] bg-surface-white border border-border-subtle rounded text-on-surface font-body-md text-body-md hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="account_circle" style="font-variation-settings: 'FILL' 0;">account_circle</span>
                        Continue with Google
                    </button>
<button class="w-full flex items-center justify-center gap-[12px] px-[12px] py-[10px] bg-surface-white border border-border-subtle rounded text-on-surface font-body-md text-body-md hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail" style="font-variation-settings: 'FILL' 0;">mail</span>
                        Continue with Outlook
                    </button>
<button class="w-full flex items-center justify-center gap-[12px] px-[12px] py-[10px] bg-surface-white border border-border-subtle rounded text-on-surface font-body-md text-body-md hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="email" style="font-variation-settings: 'FILL' 0;">email</span>
                        Continue with Yahoo
                    </button>
</div>
<!-- Divider -->
<div class="flex items-center my-[24px]">
<div class="flex-grow border-t border-border-subtle"></div>
<span class="px-[12px] bg-surface-white font-body-sm text-body-sm text-secondary">or sign in with email</span>
<div class="flex-grow border-t border-border-subtle"></div>
</div>
<!-- Email/Password Form -->
<form class="space-y-[20px]">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-[6px] uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full bg-surface-white border border-border-subtle rounded px-[12px] py-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-accent-forest focus:ring-1 focus:ring-accent-forest placeholder:text-outline-variant" id="email" name="email" placeholder="operator@company.com" required="" type="email"/>
</div>
<div>
<div class="flex items-center justify-between mb-[6px]">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-accent-forest hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-white border border-border-subtle rounded px-[12px] py-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-accent-forest focus:ring-1 focus:ring-accent-forest placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-accent-forest text-on-primary font-body-md text-body-md font-semibold px-[16px] py-[12px] rounded hover:bg-primary transition-colors flex items-center justify-center gap-[8px]" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="text-center mt-stack_lg">
<p class="font-body-md text-body-md text-secondary">
                    Don't have an account? <a class="text-accent-forest font-semibold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Footer Component (Minimal for Auth) -->
<footer class="w-full border-t border-border-subtle bg-surface-white py-[24px] px-container_margin mt-auto">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-[16px]">
<div class="text-accent-forest font-headline-md text-headline-md font-bold">
                Wireline
            </div>
<div class="flex gap-[24px] font-body-sm text-body-sm text-secondary">
<a class="hover:text-accent-forest hover:underline transition-all duration-200" href="#">Privacy</a>
<a class="hover:text-accent-forest hover:underline transition-all duration-200" href="#">Terms</a>
<a class="hover:text-accent-forest hover:underline transition-all duration-200" href="#">Contact Support</a>
</div>
<div class="font-body-sm text-body-sm text-secondary">
                © 2024 Wireline AI. All rights reserved.
            </div>
</div>
</footer>
</body></html>
