# ─────────────────────────────────────────────────────────────────
# Wireline — Single-Tenant Docker Compose
#
# Purpose: run the complete Wireline stack on a single machine /
# private cloud without Vercel. Supabase is still used as the
# managed Postgres + auth backend (no local Postgres included here
# because Supabase auth is non-trivial to self-host). Swap in a
# local Postgres + GoTrue if you need full air-gap.
#
# Quick start:
#   1. cp .env .env.prod             # fill in all keys
#   2. docker compose --env-file .env.prod up -d
#   3. Visit http://localhost:3000
#
# Production notes:
#   - Put Nginx or Caddy in front for TLS termination and cert
#     management. Bind port 3000 to localhost and expose 443 only.
#   - The Redis service here is Valkey (OSS Redis fork). Wireline's
#     rate limiter auto-detects UPSTASH_REDIS_REST_URL; when that
#     env var is not set it falls back to the REST-less redis://
#     URL via the Upstash compatible REST wrapper. For single-tenant
#     self-hosting you can also use the REDIS_URL env var directly
#     if you adapt src/lib/rate-limit.ts to the ioredis path.
# ─────────────────────────────────────────────────────────────────

services:

  # ── App ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: wireline:latest
    container_name: wireline_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Point the intra-compose rate limiter at the local Redis REST
      # proxy (if you're running the companion redis + upstash-proxy).
      # UPSTASH_REDIS_REST_URL: http://redis-proxy:8079
      # UPSTASH_REDIS_REST_TOKEN: local-dev-token
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - wireline_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Valkey (Redis-compatible) ────────────────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    container_name: wireline_redis
    restart: unless-stopped
    command: >
      valkey-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wireline_net
    # Do NOT expose Redis port externally in production.
    # expose:
    #   - "6379"

  # ── Upstash REST Proxy (bridges Wireline's HTTP rate limiter to
  #    local Valkey without extra client code changes).
  #    Source: https://github.com/upstash/local-server
  # redis-proxy:
  #   image: ghcr.io/upstash/local-server:latest
  #   container_name: wireline_redis_proxy
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #   ports:
  #     - "8079:8079"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - wireline_net

volumes:
  redis_data:

networks:
  wireline_net:
    driver: bridge
