version: 2
updates:
  # npm — weekly batched updates so review fatigue stays low.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group dev-tooling bumps so they land as a single PR.
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "@testing-library/*"
          - "vitest"
          - "vite"
          - "@vitejs/*"
          - "esbuild"
          - "tsx"
          - "typescript"
      # Group all other minor/patch updates.
      minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # React + RouterDOM majors require manual coordination.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript majors break Vercel's local-user-provided function compile
      # (TS 7 crashed with `Cannot read properties of undefined (reading 'readFile')`
      # after a green app build). Bump only with an explicit Vercel compatibility proof.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vite majors (e.g. Vite 8 / Rolldown) need a deliberate migration PR, not a
      # grouped dev-tooling bump.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the same major family as engines.node (22.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keep workflow runners on supported versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
