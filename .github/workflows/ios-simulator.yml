# Build Wireline for iOS Simulator on macOS runners (no signing).
# Simulator covers UI, navigation, and API wiring. It does not replace a device
# for PushKit VoIP, CallKit audio fidelity, Live Activity delivery, or CarPlay.

name: ios-simulator

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    # App Store uploads require Xcode 26+ and the iOS 26 SDK as of April 28, 2026.
    # Pin the runner and toolchain so CI proves the same release baseline.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show Xcode and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve and boot simulator
        id: simulator
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone 16 \(([0-9A-F-]+)\).*/\1/p' | head -1)"
          if [[ -z "$DEVICE_UDID" ]]; then
            DEVICE_UDID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone 15 \(([0-9A-F-]+)\).*/\1/p' | head -1)"
          fi
          if [[ -z "$DEVICE_UDID" ]]; then
            DEVICE_UDID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone [^)]* \(([0-9A-F-]+)\).*/\1/p' | head -1)"
          fi
          if [[ -z "$DEVICE_UDID" ]]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build Wireline (simulator, no signing)
        working-directory: ios
        run: |
          xcodebuild \
            -scheme Wireline \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install, launch, screenshot
        working-directory: ios
        run: |
          APP=$(find build -name "Wireline.app" -path "*iphonesimulator*" | head -1)
          if [[ -z "$APP" ]]; then
            echo "Wireline.app not found under ios/build"
            find build -name "*.app" || true
            exit 1
          fi
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.wireline.app || true
          sleep 3
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot /tmp/wireline-launch.png

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ios-simulator-screenshot
          path: /tmp/wireline-launch.png
          if-no-files-found: warn
