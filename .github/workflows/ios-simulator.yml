# Build Wireline for iOS Simulator on macOS runners (no signing).
# Use from Windows/Linux: push ios/** changes or workflow_dispatch → download artifacts.
#
# Simulator covers UI, navigation, and API wiring. It does NOT replace a device for
# PushKit VoIP, CallKit audio fidelity, or CarPlay Communication entitlement testing.

name: ios-simulator

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Warm CoreSimulator
        run: xcrun simctl list > /dev/null

      - name: Show available simulators
        run: xcrun simctl list devices available

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot simulator
        run: |
          DEVICE="iPhone 16"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build Wireline (simulator, no signing)
        working-directory: ios
        run: |
          xcodebuild \
            -scheme Wireline \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install, launch, screenshot
        working-directory: ios
        run: |
          APP=$(find build -name "Wireline.app" -path "*iphonesimulator*" | head -1)
          if [[ -z "$APP" ]]; then
            echo "Wireline.app not found under ios/build"
            find build -name "*.app" || true
            exit 1
          fi
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted com.wireline.app || true
          sleep 3
          xcrun simctl io booted screenshot /tmp/wireline-launch.png

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: /tmp/wireline-launch.png
          if-no-files-found: warn
