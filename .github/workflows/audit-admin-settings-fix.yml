name: audit-admin-settings-fix

on:
  push:
    branches:
      - audit/1599364-wireline-deep-review-20260817
    paths:
      - .github/workflows/audit-admin-settings-fix.yml

permissions:
  contents: write

concurrency:
  group: audit-admin-settings-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and verify the Admin Settings load fix
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"

          python .audit/apply-admin-settings-fix.py
          npm ci --no-audit --no-fund
          npx vitest run tests/admin-settings-load-contract.test.ts
          npm run lint
          git diff --check

          git rm \
            .github/workflows/audit-admin-settings-fix.yml \
            .audit/apply-admin-settings-fix.py
          git add \
            src/components/AdminSettings.tsx \
            tests/admin-settings-load-contract.test.ts
          git commit -m "fix(admin): avoid duplicate team loads and stuck loading"
          git push origin HEAD:audit/1599364-wireline-deep-review-20260817
