name: Verify full

# Runs the heavy ladder (all gates + coverage + a second build + Playwright e2e)
# on main and on demand. It deliberately does NOT run on pull_request: verify:full
# is a superset of ci.yml, so firing both on every PR to main ran the same ~16
# gates twice — real waste against this repository's Actions billing limit. PRs
# get the fast hermetic gates from ci.yml plus the dedicated e2e workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-full:
    name: Full verification ladder
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # verify:full ends in `npm run test:e2e` (Playwright). Without the browser
      # binary the whole ladder fails at the e2e step on a clean runner, which
      # silently drops every verify-full-only gate (lint:server, the security
      # and route gates, coverage) from CI. Install the browser Playwright needs
      # so the ladder can actually pass.
      - name: Accessibility contract
        run: node scripts/check-accessibility-contract.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: verify:full
        run: npm run verify:full

      - name: verify:contracts
        run: npm run verify:contracts

      - name: Browser extension check
        run: node apps/browser-extension/scripts/build.mjs --check
