name: retrigger-grok46-materialization

on:
  push:
    branches:
      - audit/native-xai-main-integration-final-20260818
    paths:
      - .github/workflows/retrigger-grok46-materialization.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrigger the one-shot materializer after mainline UI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          printf '\n# Retriggered after restoring the current AgentsContext contract.\n' >> .github/workflows/materialize-grok46-defaults.yml
          git rm .github/workflows/retrigger-grok46-materialization.yml
          git add .github/workflows/materialize-grok46-defaults.yml
          git commit -m "ci(db): rerun Grok 4.6 migration gate after UI repair"
          git push origin HEAD:"$GITHUB_REF_NAME"
