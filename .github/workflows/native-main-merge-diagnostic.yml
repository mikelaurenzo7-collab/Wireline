name: native-main-merge-integration
# Exact-head gate includes final Twilio client typing and contract-syntax repair.

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-main-merge-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: native-main-merge-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out native runtime branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Merge latest main, repair combined contracts, and verify
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -uo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          integrate() {
            set -euo pipefail
            git fetch --no-tags origin main

            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              printf '%s\n' \
                docs/AUTHZ_MATRIX.md \
                docs/business-usage-pricing-decision.md \
                src/data/wireline-knowledge.ts \
                src/lib/chatgpt-mcp-account.ts \
                src/lib/marketing-route-meta.ts \
                src/pages/CustomizationSettings.tsx \
                src/pages/Pricing.tsx \
                src/server/register-api-routes.ts \
                | sort > /tmp/expected-conflicts.txt
              git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
              diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt
            fi

            # Latest main owns current product, pricing, privacy, MCP, and route
            # truth. The deterministic post-merge scripts then restore only the
            # reviewed native Twilio + xAI owners and combined-head contracts.
            git checkout --theirs \
              docs/AUTHZ_MATRIX.md \
              docs/business-usage-pricing-decision.md \
              src/data/wireline-knowledge.ts \
              src/lib/chatgpt-mcp-account.ts \
              src/lib/marketing-route-meta.ts \
              src/pages/CustomizationSettings.tsx \
              src/pages/Pricing.tsx \
              src/server/register-api-routes.ts
            git add \
              docs/AUTHZ_MATRIX.md \
              docs/business-usage-pricing-decision.md \
              src/data/wireline-knowledge.ts \
              src/lib/chatgpt-mcp-account.ts \
              src/lib/marketing-route-meta.ts \
              src/pages/CustomizationSettings.tsx \
              src/pages/Pricing.tsx \
              src/server/register-api-routes.ts

            test -z "$(git diff --name-only --diff-filter=U)"
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
              echo "Conflict markers remain in the merged tree." >&2
              return 1
            fi

            python -m py_compile .audit/postmerge/apply.py .audit/postmerge/finalize.py
            python .audit/postmerge/apply.py
            python .audit/postmerge/finalize.py
            git add -A

            npm ci --no-audit --no-fund

            # The first authorization pass may regenerate its committed matrix;
            # the second must prove exact route coverage and zero violations.
            set +e
            npm run authz:check
            authz_first=$?
            set -e
            if [ "$authz_first" -ne 0 ]; then
              echo "Authorization matrix regenerated; verifying exact output."
            fi
            npm run authz:check

            # Remove all one-shot audit machinery before validating the exact
            # product tree that will remain on the branch and deploy to Vercel.
            rm -rf .audit
            git rm -f .github/workflows/native-main-merge-diagnostic.yml
            git add -A

            npm run lint
            npm run lint:server
            npm run lint:audit-modules
            npm run lint:eslint
            npm run test:run

            npm run design:check
            npm run route-registry:check
            npm run security:routes:check
            npm run docs:check
            npm run openapi:check
            npm run design:tokens:check
            npm run stripe:catalog:check
            npm run csp:check
            npm run runtime:policy:check
            npm run api-error:check
            npm run tenant-insert:check
            npm run server:bootstrap:check
            npm run tsconfig:excludes:check
            npm run security:audit

            npm run build
            npm run smoke:server

            npx playwright install --with-deps chromium
            npx playwright test \
              tests/e2e/marketing-viewport-lock.spec.ts \
              tests/e2e/marketing-a11y.spec.ts \
              tests/e2e/public-demo-fallback.spec.ts

            npm run source-control:check
            npm run workflow:syntax:check
            git diff --check

            git status --short
            git commit -m "Merge latest main and complete native Twilio xAI audit"
            git push origin HEAD:"$GITHUB_REF_NAME"
          }

          set +e
          integrate 2>&1 | tee /tmp/native-main-integration.log
          integration_status=${PIPESTATUS[0]}
          set -e

          if [ "$integration_status" -eq 0 ]; then
            exit 0
          fi

          git merge --abort 2>/dev/null || true
          git reset --hard "$GITHUB_SHA"
          mkdir -p .audit
          {
            echo "# Native/main integration failure"
            echo
            echo "HEAD=$GITHUB_SHA"
            echo "STATUS=$integration_status"
            echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 3600 /tmp/native-main-integration.log
            echo '```'
          } > .audit/native-main-integration-failure.txt
          git add .audit/native-main-integration-failure.txt
          git commit -m "chore(audit): record native-main integration failure"
          git push origin HEAD:"$GITHUB_REF_NAME"
          exit "$integration_status"
