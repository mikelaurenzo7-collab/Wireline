name: native-main-merge-integration

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-main-merge-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: native-main-merge-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out native runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge current main, apply verified fixes, and verify
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -uo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          run_integration() {
            set -euo pipefail
            git fetch --no-tags origin main

            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              printf '%s\n' \
                docs/AUTHZ_MATRIX.md \
                docs/business-usage-pricing-decision.md \
                src/data/wireline-knowledge.ts \
                src/lib/chatgpt-mcp-account.ts \
                src/lib/marketing-route-meta.ts \
                src/pages/CustomizationSettings.tsx \
                src/pages/Pricing.tsx \
                src/server/register-api-routes.ts \
                | sort > /tmp/expected-conflicts.txt
              git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
              diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt
            fi

            # Main owns current product/compliance truth. Native voice owns its
            # provider implementation. Generated authz truth is rebuilt below.
            git checkout --ours docs/AUTHZ_MATRIX.md
            git checkout --theirs docs/business-usage-pricing-decision.md
            git checkout --theirs src/data/wireline-knowledge.ts
            git checkout --theirs src/lib/marketing-route-meta.ts
            git checkout --theirs src/pages/CustomizationSettings.tsx
            git checkout --theirs src/pages/Pricing.tsx

            python <<'PY'
          from pathlib import Path

          def replace_conflict(path: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start = text.find("<<<<<<< HEAD")
              if start < 0:
                  raise SystemExit(f"expected conflict marker missing in {path}")
              separator = text.find("=======", start)
              end_marker = ">>>>>>> origin/main"
              end = text.find(end_marker, separator)
              if separator < 0 or end < 0:
                  raise SystemExit(f"malformed conflict markers in {path}")
              file.write_text(
                  text[:start] + replacement + text[end + len(end_marker):],
                  encoding="utf-8",
              )

          replace_conflict(
              "src/lib/chatgpt-mcp-account.ts",
              """ * Private voice in this ChatGPT-hosted widget uses OpenAI Realtime WebRTC
           * because the iframe may only connect to `https://api.openai.com`. It is not
           * the Studio or PSTN brain. Studio live tests use a server-minted xAI
           * ephemeral client secret; tenant PSTN calls use the same xAI Speech-to-Speech
           * model (`grok-voice-think-fast-2.0`) through Direct SIP.
           *
           * The host bridge speaks both ChatGPT (`window.openai`) and Claude MCP Apps
           * (`ui/initialize`, `ui/open-link`, host-context notifications) without bundling
           * `@modelcontextprotocol/ext-apps`.""",
          )

          replace_conflict(
              "src/server/register-api-routes.ts",
              """  app.use(mcpCoachingSettingsRouter);
            // Phone normalization/validation is pure and must precede the identity
            // guard, whose branding commit would otherwise land before a malformed
            // phone value 400s the request (silent half-write).""",
          )
          PY

            git add \
              docs/AUTHZ_MATRIX.md \
              docs/business-usage-pricing-decision.md \
              src/data/wireline-knowledge.ts \
              src/lib/chatgpt-mcp-account.ts \
              src/lib/marketing-route-meta.ts \
              src/pages/CustomizationSettings.tsx \
              src/pages/Pricing.tsx \
              src/server/register-api-routes.ts

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved merge paths remain:" >&2
              git diff --name-only --diff-filter=U >&2
              return 1
            fi
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
              echo "Conflict markers remain in the merged tree." >&2
              return 1
            fi

            # Repair two literal-template sequences in the staged patcher before
            # Node parses it, and normalize one browser-scroll call for DOM typing.
            python <<'PY'
          from pathlib import Path

          apply_path = Path(".audit/postmerge/apply.mjs")
          text = apply_path.read_text(encoding="utf-8")
          text = text.replace("${VAPI_API_BASE}", r"\${VAPI_API_BASE}")
          text = text.replace("${controlUrl}", r"\${controlUrl}")
          text = text.replace(
              "cadence.indexOf('return { ok: false, result: `unknown step type', cadence.indexOf('if (step.type === \\\"email\\\")')),") ,
              "cadence.indexOf(\\\"\\n  return { ok: false\\\", cadence.indexOf('if (step.type === \\\"email\\\")')),") ,
          )
          text = text.replace(
              "expect(nativeProvisioning).toContain(\\n      'runCompanyIdentityMutation(input.userId, \\\"phone_number_changed\\\"',\\n    );",
              "expect(nativeProvisioning).toContain(\\\"runCompanyIdentityMutation(\\\");\\n    expect(nativeProvisioning).toContain('\\\"phone_number_changed\\\"');",
          )
          apply_path.write_text(text, encoding="utf-8")

          viewport = Path(".audit/postmerge/marketing-viewport-lock.spec.ts")
          viewport_text = viewport.read_text(encoding="utf-8").replace(
              'window.scrollTo({ top: 180, behavior: "instant" });',
              "window.scrollTo(0, 180);",
          )
          viewport.write_text(viewport_text, encoding="utf-8")
          PY

            node --check .audit/postmerge/apply.mjs
            node .audit/postmerge/apply.mjs
            rm -rf .audit/postmerge
            git add -A

            grep -Fq 'import mcpCoachingSettingsRouter from "../routes/mcp-coaching-settings-routes";' src/server/register-api-routes.ts
            grep -Fq 'app.use(mcpCoachingSettingsRouter);' src/server/register-api-routes.ts
            grep -Fq 'import nativePhoneRoutingRouter from "../routes/native-phone-routing-routes";' src/server/register-api-routes.ts
            grep -Fq 'app.use(nativePhoneRoutingRouter);' src/server/register-api-routes.ts
            grep -Fq 'import nativePhoneReleaseRouter from "../routes/native-phone-release-routes";' src/server/register-api-routes.ts
            grep -Fq 'app.use(nativePhoneReleaseRouter);' src/server/register-api-routes.ts
            grep -Fq 'import nativeMobileVoiceRouter from "../routes/native-mobile-voice-routes";' src/server/register-api-routes.ts
            grep -Fq 'app.use(nativeMobileVoiceRouter);' src/server/register-api-routes.ts

            npm ci --no-audit --no-fund

            # First run may rewrite the matrix; the second must be exact.
            set +e
            npm run authz:check
            authz_first=$?
            set -e
            if [ "$authz_first" -ne 0 ]; then
              echo "Authorization matrix regenerated; verifying exact output."
            fi
            npm run authz:check

            npm run design:viewport:check
            npm run lint
            npm run lint:server
            npm run lint:audit-modules
            npm run test:run
            npm run build
            npx playwright test \
              tests/e2e/marketing-viewport-lock.spec.ts \
              tests/e2e/marketing-a11y.spec.ts \
              tests/e2e/public-demo-fallback.spec.ts

            # Remove the one-shot integration machinery from the product tree.
            rm -rf .audit
            git rm -f .github/workflows/native-main-merge-diagnostic.yml
            git add -A

            npm run source-control:check
            npm run workflow:syntax:check
            npm run route-registry:check
            npm run security:routes:check
            npm run docs:check
            npm run openapi:check
            git diff --check

            git status --short
            git commit -m "Merge main into native Twilio and xAI runtime"
            git push origin HEAD:"$GITHUB_REF_NAME"
          }

          set +e
          run_integration 2>&1 | tee /tmp/native-main-integration.log
          integration_status=${PIPESTATUS[0]}
          set -e

          if [ "$integration_status" -eq 0 ]; then
            exit 0
          fi

          git merge --abort 2>/dev/null || true
          git reset --hard "$GITHUB_SHA"
          mkdir -p .audit
          {
            echo "# Native/main integration failure"
            echo
            echo "HEAD=$GITHUB_SHA"
            echo "STATUS=$integration_status"
            echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 3000 /tmp/native-main-integration.log
            echo '```'
          } > .audit/native-main-integration-failure.txt
          git add .audit/native-main-integration-failure.txt
          git commit -m "chore(audit): record native-main integration failure"
          git push origin HEAD:"$GITHUB_REF_NAME"
          exit "$integration_status"
