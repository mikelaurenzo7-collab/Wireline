name: native-main-integration-repair

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-main-integration-repair.yml

permissions:
  contents: write

concurrency:
  group: native-main-integration-repair
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'audit-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out native runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge current main, repair verified drift, and run full verification
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
          CI: "true"
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/native-main-integration-repair.log) 2>&1

          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          record_failure() {
            status=$?
            trap - ERR
            set +e
            git merge --abort >/dev/null 2>&1 || true
            git reset --hard "$GITHUB_SHA" >/dev/null 2>&1 || true
            mkdir -p .audit
            {
              echo "# Native/main integration repair failure"
              echo
              echo "HEAD=$GITHUB_SHA"
              echo "STATUS=$status"
              echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo '```text'
              tail -n 5000 /tmp/native-main-integration-repair.log
              echo '```'
            } > .audit/native-main-integration-repair-failure.txt
            git add .audit/native-main-integration-repair-failure.txt
            git commit -m "chore(audit): record native-main repair failure" || true
            git push origin HEAD:"$GITHUB_REF_NAME" || true
            exit "$status"
          }
          trap record_failure ERR

          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Resolving verified native/main conflicts."

            for file in \
              docs/AUTHZ_MATRIX.md \
              src/data/wireline-knowledge.ts; do
              if git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            for file in \
              docs/business-usage-pricing-decision.md \
              src/lib/marketing-route-meta.ts \
              src/pages/CustomizationSettings.tsx \
              src/pages/Pricing.tsx; do
              if git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            python <<'PY'
          from pathlib import Path

          def resolve_first(path: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start = text.find("<<<<<<< HEAD")
              if start < 0:
                  return
              separator = text.find("=======", start)
              end_marker = ">>>>>>> origin/main"
              end = text.find(end_marker, separator)
              if separator < 0 or end < 0:
                  raise SystemExit(f"malformed conflict markers in {path}")
              file.write_text(
                  text[:start] + replacement + text[end + len(end_marker):],
                  encoding="utf-8",
              )

          resolve_first(
              "src/lib/chatgpt-mcp-account.ts",
              """ * Private voice in this ChatGPT-hosted widget uses OpenAI Realtime WebRTC
           * because the iframe may only connect to `https://api.openai.com`. It is not
           * the Studio or PSTN brain. Studio live tests use a server-minted xAI
           * ephemeral client secret; tenant PSTN calls use the same xAI Speech-to-Speech
           * model (`grok-voice-think-fast-2.0`) through Direct SIP.
           *
           * The host bridge speaks both ChatGPT (`window.openai`) and Claude MCP Apps
           * (`ui/initialize`, `ui/open-link`, host-context notifications) without bundling
           * `@modelcontextprotocol/ext-apps`.""",
          )

          resolve_first(
              "src/server/register-api-routes.ts",
              """  app.use(mcpCoachingSettingsRouter);
            // Phone normalization/validation is pure and must precede the identity
            // guard, whose branding commit would otherwise land before a malformed
            // phone value 400s the request (silent half-write).""",
          )
          PY

            for file in src/lib/chatgpt-mcp-account.ts src/server/register-api-routes.ts; do
              if git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                git add "$file"
              fi
            done
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unexpected or unresolved merge conflicts:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
            echo "Conflict markers remain in the merged tree." >&2
            exit 1
          fi

          python scripts/repair-native-main-integration.py

          # Remove one invalid asymmetric matcher emitted by the one-shot repair;
          # the following numeric lower-bound assertion is the actual contract.
          python <<'PY'
          from pathlib import Path
          path = Path("tests/company-identity-contract.test.ts")
          text = path.read_text(encoding="utf-8")
          block = '''    expect(
              phoneMutationSources.match(/runCompanyIdentityMutation\\([^)]*"phone_number_changed"/g) || [],
            ).toHaveLength(expect.any(Number));
          '''
          text = text.replace(block, "", 1)
          if "toHaveLength(expect.any(Number))" in text:
              raise SystemExit("invalid company identity matcher remains")
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq 'import mcpCoachingSettingsRouter from "../routes/mcp-coaching-settings-routes";' src/server/register-api-routes.ts
          grep -Fq 'app.use(mcpCoachingSettingsRouter);' src/server/register-api-routes.ts
          grep -Fq 'import nativePhoneRoutingRouter from "../routes/native-phone-routing-routes";' src/server/register-api-routes.ts
          grep -Fq 'app.use(nativePhoneRoutingRouter);' src/server/register-api-routes.ts
          grep -Fq 'import nativePhoneReleaseRouter from "../routes/native-phone-release-routes";' src/server/register-api-routes.ts
          grep -Fq 'app.use(nativePhoneReleaseRouter);' src/server/register-api-routes.ts
          grep -Fq 'import nativeMobileVoiceRouter from "../routes/native-mobile-voice-routes";' src/server/register-api-routes.ts
          grep -Fq 'app.use(nativeMobileVoiceRouter);' src/server/register-api-routes.ts

          npm ci --no-audit --no-fund

          set +e
          npm run authz:check
          authz_first=$?
          set -e
          if [ "$authz_first" -ne 0 ]; then
            echo "Authorization matrix was regenerated; verifying exact output."
          fi
          npm run authz:check

          npm run lint:server
          npm run lint:audit-modules
          npm run test:run
          npm run build
          npm run test:e2e

          # Production dependency exposure blocks the integration; dev-tooling
          # advisories are reported by the normal CI audit lane separately.
          npm audit --omit=dev --audit-level=high

          rm -f .github/workflows/native-main-merge-diagnostic.yml
          rm -f .github/workflows/native-main-integration-repair.yml
          rm -f scripts/repair-native-main-integration.py
          rm -f .audit/native-main-conflicts.txt
          rm -f .audit/native-main-integration-failure.txt
          rm -f .audit/native-main-integration-repair-failure.txt
          git add -A

          npm run source-control:check
          npm run workflow:syntax:check
          npm run docs:check
          git diff --check

          git status --short
          git commit -m "Merge latest main into native Twilio and xAI runtime"
          git push origin HEAD:"$GITHUB_REF_NAME"
