name: CodeQL Security Scan

# Triggers temporarily reduced to manual-only (workflow_dispatch) while
# GitHub Actions billing is being sorted. Restore push/pull_request/schedule
# triggers once billing is current.
on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Optional: add custom queries from CodeQL packs
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
