name: CodeQL Security Scan

# CodeQL uploads results to GitHub's code-scanning dashboard, which requires
# GitHub Advanced Security. That feature is only available on public repos or
# private repos on a GitHub Enterprise / Advanced Security plan.
# Until code scanning is enabled in repo Settings → Security → Code scanning,
# keep this workflow manual-only so it doesn't block CI on every PR.
# To enable: Settings → Security → Code scanning → Set up → Advanced → Save.
on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Optional: add custom queries from CodeQL packs
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
