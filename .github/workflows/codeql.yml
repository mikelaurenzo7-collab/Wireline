name: CodeQL Security Scan

# Private-repository CodeQL requires GitHub Code Security. Keep the workflow
# present and current, but run it only after the repository feature is enabled.
# To activate: enable code scanning, then set the repository Actions variable
# WIRELINE_CODEQL_ENABLED=true. This avoids a permanently red, non-actionable
# check while preserving the full scan as soon as the entitlement is available.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ vars.WIRELINE_CODEQL_ENABLED == 'true' }}
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Optional: add custom queries from CodeQL packs
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
