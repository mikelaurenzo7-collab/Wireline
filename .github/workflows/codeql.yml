name: CodeQL Security Scan

# CodeQL uploads results to GitHub's code-scanning dashboard, which requires
# GitHub Advanced Security. That feature is only available on public repos or
# private repos on a GitHub Enterprise / Advanced Security plan.
# Runs on PRs/pushes when GitHub Advanced Security is enabled. If code scanning
# is not enabled, the analyze job is allowed to fail without blocking merges.
# To enable full uploads: Settings → Security → Code scanning → Set up → Save.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Optional: add custom queries from CodeQL packs
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
