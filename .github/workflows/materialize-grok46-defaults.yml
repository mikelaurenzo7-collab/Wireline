name: materialize-grok46-defaults

on:
  push:
    branches:
      - audit/native-xai-main-integration-final-20260818
    paths:
      - .github/workflows/materialize-grok46-defaults.yml

permissions:
  contents: write

concurrency:
  group: materialize-grok46-defaults
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Materialize, verify, and commit the immutable 0154 state
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -uo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          finalize() {
            set -euo pipefail

            python -m py_compile .audit/postmerge/apply-grok46-schema.py
            python .audit/postmerge/apply-grok46-schema.py

            # Regenerate the reviewed metadata from its permanent materializer.
            # Fixed hashes make any nondeterminism or unreviewed schema drift fail.
            node scripts/materialize-drizzle-meta.mjs

            # Validate the exact product tree that will remain on the branch.
            git rm -rf .audit
            git rm -f .github/workflows/materialize-grok46-defaults.yml
            git add -A
            git diff --check

            npm ci --no-audit --no-fund

            npm run authz:check
            npm run lint
            npm run lint:server
            npm run lint:audit-modules
            npm run lint:eslint
            npm run test:run

            npm run design:check
            npm run route-registry:check
            npm run security:routes:check
            npm run docs:check
            npm run openapi:check
            npm run design:tokens:check
            npm run stripe:catalog:check
            npm run csp:check
            npm run runtime:policy:check
            npm run api-error:check
            npm run tenant-insert:check
            npm run server:bootstrap:check
            npm run tsconfig:excludes:check
            npm run security:audit
            npm run db:check

            npm run build
            npm run smoke:server

            npx playwright install --with-deps chromium
            npx playwright test \
              tests/e2e/marketing-viewport-lock.spec.ts \
              tests/e2e/marketing-a11y.spec.ts \
              tests/e2e/public-demo-fallback.spec.ts

            npm run source-control:check
            npm run workflow:syntax:check
            git diff --check

            git status --short
            git commit -m "fix(db): reconcile persisted Grok 4.6 defaults"
            git push origin HEAD:"$GITHUB_REF_NAME"
          }

          set +e
          finalize 2>&1 | tee /tmp/grok46-materialization.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          git reset --hard "$GITHUB_SHA"
          mkdir -p .audit
          {
            echo "# Grok 4.6 materialization failure"
            echo
            echo "HEAD=$GITHUB_SHA"
            echo "STATUS=$status"
            echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 3600 /tmp/grok46-materialization.log
            echo '```'
          } > .audit/grok46-materialization-failure.txt
          git add .audit/grok46-materialization-failure.txt
          git commit -m "chore(audit): record Grok 4.6 materialization failure"
          git push origin HEAD:"$GITHUB_REF_NAME"
          exit "$status"
