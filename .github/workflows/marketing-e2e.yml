name: Marketing e2e

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "marketing-e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  homepage:
    name: Homepage accessibility and story smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run marketing e2e smoke
        run: npm run test:e2e
        env:
          CI: "true"
          WIRELINE_E2E_EMAIL: ${{ secrets.WIRELINE_E2E_EMAIL }}
          WIRELINE_E2E_PASSWORD: ${{ secrets.WIRELINE_E2E_PASSWORD }}
