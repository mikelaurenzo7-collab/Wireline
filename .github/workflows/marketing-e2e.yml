name: Marketing e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    name: Homepage accessibility and story smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # package-lock is retained for local installs but has historical root-entry
      # drift. Install from package.json until full regeneration lands.
      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run marketing e2e smoke
        run: npm run test:e2e
