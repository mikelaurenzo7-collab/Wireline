name: Lint and test

# Focused pull-request and main gate: typecheck, ESLint, and the unit suite.
# ci.yml remains the heavier pull-request ladder. verify-full.yml remains the
# release superset on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: ESLint
        run: npm run lint:eslint

      - name: Unit tests
        run: npm run test:run
