name: Product contracts

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "product-contracts-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  contracts:
    name: Vitest product and metadata contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run product contracts
        run: npm run verify:contracts
