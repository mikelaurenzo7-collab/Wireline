name: Product contracts

# Manual targeted diagnostic only. CI's full Vitest run includes these tests on
# PRs, and verify-full.yml runs verify:contracts on main.
"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "product-contracts-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  contracts:
    name: Vitest product and metadata contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run product contracts
        run: npm run verify:contracts
