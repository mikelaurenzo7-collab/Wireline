name: repair-native-finalizer

on:
  push:
    branches:
      - audit/native-xai-main-integration-final-20260818
    paths:
      - .github/workflows/repair-native-finalizer.yml

permissions:
  contents: write

concurrency:
  group: repair-native-finalizer
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make combined-head cleanup idempotent and retrigger gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          python <<'PY'
          from pathlib import Path

          finalizer = Path('.audit/postmerge/finalize.py')
          text = finalizer.read_text(encoding='utf-8')
          old = '''activation_path = "src/lib/voice/xai-phone-activation-service.ts"
          activation = read(activation_path)
          legacy_cast = "const client = getTwilioClient() as any;"
          if activation.count(legacy_cast) != 2:
              raise RuntimeError("expected exactly two legacy Twilio client casts")
          write(activation_path, activation.replace(legacy_cast, "const client = getTwilioClient();"))
          '''
          new = '''activation_path = "src/lib/voice/xai-phone-activation-service.ts"
          activation = read(activation_path)
          legacy_cast = "const client = getTwilioClient() as any;"
          # Combined-head runtime may already be typed. Cleanup is intentionally
          # idempotent: replace every remaining legacy cast, but never require a
          # brittle source-count that can fail after a valid refactor.
          if legacy_cast in activation:
              write(activation_path, activation.replace(legacy_cast, "const client = getTwilioClient();"))
          '''
          if text.count(old) != 1:
              raise SystemExit('legacy Twilio cleanup block did not match exactly once')
          finalizer.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/native-main-merge-diagnostic.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          marker = '# Final isolated exact-head integration gate for source, migrations, tests, and docs.\n'
          replacement = marker + '# Finalizer cleanup is idempotent after typed Twilio lifecycle refactors.\n'
          if workflow_text.count(marker) != 1:
              raise SystemExit('integration workflow marker did not match exactly once')
          workflow.write_text(workflow_text.replace(marker, replacement, 1), encoding='utf-8')
          PY

          git rm .github/workflows/repair-native-finalizer.yml
          git add .audit/postmerge/finalize.py .github/workflows/native-main-merge-diagnostic.yml
          git commit -m "ci(audit): make native finalizer cleanup idempotent"
          git push origin HEAD:"$GITHUB_REF_NAME"
