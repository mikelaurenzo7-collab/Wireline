name: native-main-integration-v2

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-main-integration-v2.yml

permissions:
  contents: write

concurrency:
  group: native-main-integration-v2
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge, patch, verify, and push
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -uo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          integrate() {
            set -euo pipefail
            git fetch --no-tags origin main

            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              printf '%s\n' \
                docs/AUTHZ_MATRIX.md \
                docs/business-usage-pricing-decision.md \
                src/data/wireline-knowledge.ts \
                src/lib/chatgpt-mcp-account.ts \
                src/lib/marketing-route-meta.ts \
                src/pages/CustomizationSettings.tsx \
                src/pages/Pricing.tsx \
                src/server/register-api-routes.ts \
                | sort > /tmp/expected-conflicts.txt
              git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
              diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt
            fi

            git checkout --ours docs/AUTHZ_MATRIX.md
            git checkout --theirs docs/business-usage-pricing-decision.md
            git checkout --theirs src/data/wireline-knowledge.ts
            git checkout --theirs src/lib/marketing-route-meta.ts
            git checkout --theirs src/pages/CustomizationSettings.tsx
            git checkout --theirs src/pages/Pricing.tsx

            python <<'PY'
          from pathlib import Path

          def resolve(path: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start = text.find("<<<<<<< HEAD")
              separator = text.find("=======", start)
              marker = ">>>>>>> origin/main"
              end = text.find(marker, separator)
              if min(start, separator, end) < 0:
                  raise SystemExit(f"missing conflict markers in {path}")
              target.write_text(
                  text[:start] + replacement + text[end + len(marker):],
                  encoding="utf-8",
              )

          resolve(
              "src/lib/chatgpt-mcp-account.ts",
              """ * Private voice in this ChatGPT-hosted widget uses OpenAI Realtime WebRTC
           * because the iframe may only connect to `https://api.openai.com`. It is not
           * the Studio or PSTN brain. Studio live tests use a server-minted xAI
           * ephemeral client secret; tenant PSTN calls use the same xAI Speech-to-Speech
           * model (`grok-voice-think-fast-2.0`) through Direct SIP.
           *
           * The host bridge speaks both ChatGPT (`window.openai`) and Claude MCP Apps
           * (`ui/initialize`, `ui/open-link`, host-context notifications) without bundling
           * `@modelcontextprotocol/ext-apps`.""",
          )

          resolve(
              "src/server/register-api-routes.ts",
              """  app.use(mcpCoachingSettingsRouter);
            // Phone normalization/validation is pure and must precede the identity
            // guard, whose branding commit would otherwise land before a malformed
            // phone value 400s the request (silent half-write).""",
          )
          PY

            git add \
              docs/AUTHZ_MATRIX.md \
              docs/business-usage-pricing-decision.md \
              src/data/wireline-knowledge.ts \
              src/lib/chatgpt-mcp-account.ts \
              src/lib/marketing-route-meta.ts \
              src/pages/CustomizationSettings.tsx \
              src/pages/Pricing.tsx \
              src/server/register-api-routes.ts

            test -z "$(git diff --name-only --diff-filter=U)"
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
              echo "conflict markers remain" >&2
              return 1
            fi

            python <<'PY'
          from pathlib import Path

          apply_path = Path(".audit/postmerge/apply.mjs")
          text = apply_path.read_text(encoding="utf-8")
          text = text.replace("${VAPI_API_BASE}", "\\${VAPI_API_BASE}")
          text = text.replace("${controlUrl}", "\\${controlUrl}")

          needle = "cadence.indexOf('return { ok: false, result: " + chr(96) + "unknown step type'"
          position = text.find(needle)
          if position < 0:
              raise SystemExit("cadence replacement marker missing")
          line_start = text.rfind("\n", 0, position) + 1
          line_end = text.find("\n", position)
          replacement = (
              '      cadence.indexOf("\\n  return { ok: false", '
              'cadence.indexOf(\'if (step.type === "email")\')), '
          )
          text = text[:line_start] + replacement + text[line_end:]
          apply_path.write_text(text, encoding="utf-8")

          viewport = Path(".audit/postmerge/marketing-viewport-lock.spec.ts")
          viewport.write_text(
              viewport.read_text(encoding="utf-8").replace(
                  'window.scrollTo({ top: 180, behavior: "instant" });',
                  "window.scrollTo(0, 180);",
              ),
              encoding="utf-8",
          )
          PY

            node --check .audit/postmerge/apply.mjs
            node .audit/postmerge/apply.mjs
            rm -rf .audit/postmerge
            git add -A

            npm ci --no-audit --no-fund

            set +e
            npm run authz:check
            authz_first=$?
            set -e
            if [ "$authz_first" -ne 0 ]; then
              echo "authorization matrix regenerated"
            fi
            npm run authz:check

            npm run design:viewport:check
            npm run lint
            npm run lint:server
            npm run lint:audit-modules
            npm run test:run
            npm run build
            npx playwright test \
              tests/e2e/marketing-viewport-lock.spec.ts \
              tests/e2e/marketing-a11y.spec.ts \
              tests/e2e/public-demo-fallback.spec.ts

            rm -rf .audit
            git rm -f \
              .github/workflows/native-main-merge-diagnostic.yml \
              .github/workflows/native-main-integration-v2.yml
            git add -A

            npm run source-control:check
            npm run workflow:syntax:check
            npm run route-registry:check
            npm run security:routes:check
            npm run docs:check
            npm run openapi:check
            git diff --check

            git commit -m "Merge main into native Twilio and xAI runtime"
            git push origin HEAD:"$GITHUB_REF_NAME"
          }

          set +e
          integrate 2>&1 | tee /tmp/native-main-integration-v2.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          git merge --abort 2>/dev/null || true
          git reset --hard "$GITHUB_SHA"
          mkdir -p .audit
          {
            echo "# Native/main integration v2 failure"
            echo
            echo "HEAD=$GITHUB_SHA"
            echo "STATUS=$status"
            echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 3200 /tmp/native-main-integration-v2.log
            echo '```'
          } > .audit/native-main-integration-failure.txt
          git add .audit/native-main-integration-failure.txt
          git commit -m "chore(audit): record native-main integration v2 failure"
          git push origin HEAD:"$GITHUB_REF_NAME"
          exit "$status"
