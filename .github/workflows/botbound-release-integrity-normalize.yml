name: BotBound release-integrity normalization

on:
  push:
    branches:
      - codex/botbound-release-integrity-2026-08-31

permissions:
  contents: write

concurrency:
  group: botbound-release-integrity-normalize
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/botbound-release-integrity-2026-08-31
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Land reviewed-source branding and deterministic build fixes
        run: |
          node scripts/apply-botbound-customer-literal-migration.mjs
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "scripts/vercel-deploy.mjs",
              'import "./apply-botbound-customer-literal-migration.mjs";\n',
              "",
          )
          replace_once(
              "scripts/vercel-deploy.mjs",
              " * pipeline: sanitize retired client configuration, migrate the final approved\n * customer-facing BotBound literals, prove the sanitizer contract, run the\n",
              " * pipeline: sanitize retired client configuration, verify reviewed BotBound\n * customer-facing source, prove the sanitizer contract, run the\n",
          )
          replace_once(
              "scripts/vercel-deploy.mjs",
              "// Prove the production compatibility bridge before migrations or any provider\n// gate can run. The sanitizer and BotBound customer-literal migration are loaded\n// in this parent process first; the contract itself then runs in the same\n",
              "// Prove the retired-client environment bridge before migrations or any provider\n// gate can run. The sanitizer is loaded in this parent process first; the\n// contract itself then runs in the same\n",
          )
          replace_once(
              "scripts/render-image-assets.mjs",
              "      loadSystemFonts: true,",
              "      loadSystemFonts: false,",
          )
          replace_once(
              "scripts/render-image-assets.mjs",
              '[resolve(root, "apps/browser-extension/scripts/build.mjs")],',
              '[resolve(root, "apps/browser-extension/scripts/build.mjs"), "--no-publish"],',
          )
          replace_once(
              ".github/workflows/ci.yml",
              "          node apps/browser-extension/scripts/build.mjs\n\n      - name: Build",
              "          node apps/browser-extension/scripts/build.mjs --no-publish\n\n      - name: Build",
          )
          PY
          rm scripts/apply-botbound-customer-literal-migration.mjs

      - name: Type, lint, current release, and artifact checks
        run: |
          npm run lint
          npm run lint:server
          npm run lint:audit-modules
          npm run lint:eslint
          node scripts/vercel-build.mjs
          node scripts/run-test-estate.mjs --canonical-release-second-pass
          git ls-files -z 'public/*.png' 'public/downloads/*.zip' 'ios/Wireline/Assets.xcassets/AppIcon.appiconset/icon.png' | sort -z | xargs -0 sha256sum > /tmp/botbound-assets-first.sha256
          npm run build
          git ls-files -z 'public/*.png' 'public/downloads/*.zip' 'ios/Wireline/Assets.xcassets/AppIcon.appiconset/icon.png' | sort -z | xargs -0 sha256sum > /tmp/botbound-assets-second.sha256
          diff -u /tmp/botbound-assets-first.sha256 /tmp/botbound-assets-second.sha256
          git diff --check
          npx prettier --check scripts/vercel-deploy.mjs scripts/render-image-assets.mjs .github/workflows/ci.yml

      - name: Commit normalized source and generated assets
        run: |
          rm .github/workflows/botbound-release-integrity-normalize.yml
          git status --short
          git config user.name "BotBound Release Integrity"
          git config user.email "botbound-release-integrity@users.noreply.github.com"
          git add -A
          git commit -m "fix: make reviewed BotBound source match release artifacts"
          git push origin HEAD:codex/botbound-release-integrity-2026-08-31
