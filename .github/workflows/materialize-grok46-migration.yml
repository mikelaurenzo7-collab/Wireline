name: materialize-grok46-migration

on:
  push:
    branches:
      - audit/native-xai-main-integration-final-20260818
    paths:
      - .github/workflows/materialize-grok46-migration.yml

permissions:
  contents: write

concurrency:
  group: materialize-grok46-migration
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and commit migration 0154 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          node scripts/materialize-drizzle-meta.mjs
          python .audit/postmerge/apply-grok46-schema.py
          node scripts/materialize-drizzle-meta.mjs

          python -m json.tool drizzle/migrations/meta/_journal.json >/dev/null
          python -m json.tool drizzle/migrations/meta/0052_snapshot.json >/dev/null
          node --check scripts/materialize-drizzle-meta.mjs

          grep -Fq '"idx": 52' drizzle/migrations/meta/_journal.json
          grep -Fq '"tag": "0154_xai_grok_46_persisted_defaults"' drizzle/migrations/meta/_journal.json
          grep -Fq 'voiceLlmModel: text("voice_llm_model").default("grok-4.6")' src/db/schema.ts
          grep -Fq 'voiceLlmModel: text("voice_llm_model").default("grok-4.6")' src/db/schema-base.ts
          grep -Fq 'TARGET_0052_SHA256' scripts/materialize-drizzle-meta.mjs
          ! grep -Fq 'TARGET_0052_SHA256 = "PENDING_COMPUTE"' scripts/materialize-drizzle-meta.mjs

          git rm .audit/postmerge/apply-grok46-schema.py
          git rm .github/workflows/materialize-grok46-migration.yml
          rmdir .audit/postmerge 2>/dev/null || true
          rmdir .audit 2>/dev/null || true
          git add \
            src/db/schema.ts \
            src/db/schema-base.ts \
            drizzle/migrations/meta/_journal.json \
            drizzle/migrations/meta/0052_snapshot.json \
            scripts/materialize-drizzle-meta.mjs \
            tests/silent-failure-round2-contract.test.ts \
            tests/grok-46-persisted-defaults-contract.test.ts

          git diff --cached --check
          git commit -m "fix(db): journal Grok 4.6 persisted defaults"
          git push origin HEAD:"$GITHUB_REF_NAME"
