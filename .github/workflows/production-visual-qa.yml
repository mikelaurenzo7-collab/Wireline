name: Production visual QA

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - vercel.json
      - scripts/capture-prod-visual-qa.mjs
      - scripts/check-visual-qa-manifest.mjs
      - scripts/lib/production-visual-qa-contract.mjs
      - scripts/lib/production-url.mjs
      - scripts/lib/release-source-verification.mjs
      - .github/workflows/production-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture responsive production QA
    runs-on: ubuntu-latest
    # Includes dependency/browser setup, up to 10 minutes waiting for the exact
    # production SHA, and 340 sequential semantic captures / 680 screenshots.
    timeout-minutes: 60
    env:
      CI: "true"
      WIRELINE_VISUAL_BASE_URL: https://botbound.me
      WIRELINE_VISUAL_OUTPUT_DIR: artifacts/visual-qa-prod
      WIRELINE_VISUAL_EXPECTED_EMAIL: wireline.demo@trywireline.com
      WIRELINE_VISUAL_EMAIL: ${{ secrets.WIRELINE_VISUAL_EMAIL }}
      WIRELINE_VISUAL_PASSWORD: ${{ secrets.WIRELINE_VISUAL_PASSWORD }}
      WIRELINE_VISUAL_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production routes
        run: node scripts/capture-prod-visual-qa.mjs

      - name: Enforce production visual QA gate
        run: node scripts/check-visual-qa-manifest.mjs --production artifacts/visual-qa-prod/latest-manifest.json

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: botbound-production-visual-qa
          # The gate evaluates authenticated screenshots inside the ephemeral
          # runner, but they may contain demo-account identity fields. Persist
          # only public screenshots and the cryptographic evidence manifests.
          path: |
            artifacts/visual-qa-prod
            !artifacts/visual-qa-prod/**/*-authenticated-*.png
          if-no-files-found: warn
          retention-days: 14
