name: Production visual QA

on:
  # Render auto-deploy is disabled. Dispatch after both services report the
  # promoted release; a main push alone is not a production deployment.
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit deployed on the Render API and voice services
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Capture responsive production QA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Includes dependency/browser setup, up to 10 minutes waiting for the exact
    # production SHA, and 340 sequential semantic captures / 680 screenshots.
    timeout-minutes: 60
    env:
      CI: "true"
      WIRELINE_VISUAL_BASE_URL: https://botbound.app
      WIRELINE_VISUAL_OUTPUT_DIR: artifacts/visual-qa-prod
      WIRELINE_VISUAL_EXPECTED_EMAIL: wireline.demo@trywireline.com
      WIRELINE_VISUAL_EXPECTED_COMMIT: ${{ inputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promoted source before executing it
        shell: bash
        run: |
          if [[ ! "$WIRELINE_VISUAL_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA."
            exit 1
          fi
          git merge-base --is-ancestor "$WIRELINE_VISUAL_EXPECTED_COMMIT" origin/main
          git checkout --detach "$WIRELINE_VISUAL_EXPECTED_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production routes
        env:
          WIRELINE_VISUAL_EMAIL: ${{ secrets.WIRELINE_VISUAL_EMAIL }}
          WIRELINE_VISUAL_PASSWORD: ${{ secrets.WIRELINE_VISUAL_PASSWORD }}
        # GITHUB_SHA identifies the dispatch ref, which can be newer than the
        # promoted release. The capture checks HEAD against release_sha and the
        # served source before and after recording its evidence.
        run: env -u GITHUB_SHA node scripts/capture-prod-visual-qa.mjs

      - name: Enforce production visual QA gate
        run: node scripts/check-visual-qa-manifest.mjs --production artifacts/visual-qa-prod/latest-manifest.json

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: botbound-production-visual-qa
          # The gate evaluates authenticated screenshots inside the ephemeral
          # runner, but they may contain demo-account identity fields. Persist
          # only public screenshots and the cryptographic evidence manifests.
          path: |
            artifacts/visual-qa-prod
            !artifacts/visual-qa-prod/**/*-authenticated-*.png
          if-no-files-found: warn
          retention-days: 14
