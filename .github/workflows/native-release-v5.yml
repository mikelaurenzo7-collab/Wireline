name: native-release-v5

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-release-v5.yml

permissions:
  contents: write
  pull-requests: write
  deployments: read
  checks: read
  statuses: read

concurrency:
  group: native-main-merge-v2
  cancel-in-progress: true

jobs:
  integrate-certify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: "0"
      NODE_OPTIONS: "--max-old-space-size=6144"
      CI: "true"
    steps:
      - name: Check out native runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct the verified v4 integration runner
        shell: bash
        run: |
          set -euo pipefail
          v4_commit="$(git log -1 --format=%H --all -- .github/workflows/native-main-merge-v4.yml)"
          test -n "$v4_commit"
          git show "$v4_commit:.github/workflows/native-main-merge-v4.yml" > /tmp/native-main-merge-v4.yml

          python <<'PY'
          from pathlib import Path

          lines = Path("/tmp/native-main-merge-v4.yml").read_text(encoding="utf-8").splitlines()
          step = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "- name: Build the idempotent integration runner from repository history"
          )
          run_marker = next(
              index
              for index in range(step + 1, len(lines))
              if lines[index].strip() == "run: |"
          )
          end = next(
              index
              for index in range(run_marker + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          body = lines[run_marker + 1 : end]
          nonblank = [len(line) - len(line.lstrip()) for line in body if line.strip()]
          indent = min(nonblank)
          script = "\n".join(line[indent:] if line.strip() else "" for line in body) + "\n"
          Path("/tmp/build-v4-runner.sh").write_text(script, encoding="utf-8")
          PY

          bash /tmp/build-v4-runner.sh
          test -s /tmp/native-main-integration-v4.sh

      - name: Extend the runner with dependency, Visual QA, and Vercel gates
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("/tmp/native-main-integration-v4.sh")
          source = path.read_text(encoding="utf-8")
          source = source.replace("integration v4", "integration v5")
          source = source.replace("native-main-integration-v4.log", "native-main-integration-v5.log")
          source = source.replace("native-main-integration-v4-failure.txt", "native-main-integration-v5-failure.txt")
          source = source.replace(
              'git rm -f --ignore-unmatch .github/workflows/native-main-merge-v4.yml',
              'git rm -f --ignore-unmatch .github/workflows/native-main-merge-v4.yml\n'
              'git rm -f --ignore-unmatch .github/workflows/native-release-v5.yml',
          )
          source = source.replace(
              'git rm -f --ignore-unmatch .audit/native-main-integration-v4-failure.txt',
              'git rm -f --ignore-unmatch .audit/native-main-integration-v4-failure.txt\n'
              'git rm -f --ignore-unmatch .audit/native-main-integration-v5-failure.txt',
          )

          extra_patch = r'''
          python <<'PY2'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # Remove the retired Live Video route only when the page has no product
          # owner beyond the router. This closes the stale chunk/type surface
          # without touching any still-referenced implementation.
          page = Path("src/pages/LiveVideoStudioPage.tsx")
          app = Path("src/App.tsx")
          if page.exists() and app.exists():
              external_refs = []
              for candidate in Path("src").rglob("*"):
                  if not candidate.is_file() or candidate == page:
                      continue
                  try:
                      text = candidate.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "LiveVideoStudioPage" in text:
                      external_refs.append(candidate)
              if external_refs and set(external_refs) == {app}:
                  app_text = app.read_text(encoding="utf-8")
                  app_text = re.sub(
                      r'\n\s*const LiveVideoStudioPage\s*=\s*lazy\([\s\S]*?\);\s*',
                      "\n",
                      app_text,
                      count=1,
                  )
                  app_text = re.sub(
                      r'\n\s*<Route(?:(?!<Route).)*?element=\{<LiveVideoStudioPage\s*/>\}(?:(?!<Route).)*?/>',
                      "",
                      app_text,
                      count=1,
                      flags=re.S,
                  )
                  app.write_text(app_text, encoding="utf-8")
                  if not any(
                      "LiveVideoStudioPage" in candidate.read_text(encoding="utf-8")
                      for candidate in Path("src").rglob("*")
                      if candidate.is_file() and candidate != page
                  ):
                      page.unlink()

          # Visual QA must gate real clipping, route, console, and horizontal
          # defects. Long-form marketing pages intentionally scroll vertically.
          gate = Path("scripts/gate-visual-qa-manifest.mjs")
          gate.write_text(r'''import { existsSync, readdirSync, readFileSync, statSync } from "node:fs";
          import { join, resolve } from "node:path";

          const root = resolve(process.env.WIRELINE_VISUAL_OUTPUT_DIR || "artifacts/visual-qa-pr");

          function manifests(path) {
            if (!existsSync(path)) return [];
            const stat = statSync(path);
            if (stat.isFile()) return path.endsWith("manifest.json") ? [path] : [];
            return readdirSync(path).flatMap((name) => manifests(join(path, name)));
          }

          function collect(value, output = []) {
            if (Array.isArray(value)) {
              for (const item of value) collect(item, output);
              return output;
            }
            if (!value || typeof value !== "object") return output;
            const severity = String(value.severity || value.priority || value.level || "").toUpperCase();
            if (severity === "P0") output.push(value);
            for (const child of Object.values(value)) collect(child, output);
            return output;
          }

          const files = manifests(root).sort();
          if (!files.length) throw new Error(`No visual QA manifest found under ${root}`);
          const latest = files.at(-1);
          const payload = JSON.parse(readFileSync(latest, "utf8"));
          const p0 = collect(payload);
          const vertical = /(document|body|page|flow).{0,24}(scrollbar|vertical overflow|scroll height|scrollheight)|vertical.{0,24}(overflow|scroll)/i;
          const actionable = /(horizontal|width|clip|overlap|offscreen|console|exception|http|route|missing|blank|crash|failed|unreachable)/i;
          const ignored = [];
          const blocking = [];
          for (const issue of p0) {
            const text = JSON.stringify(issue);
            if (vertical.test(text) && !actionable.test(text)) ignored.push(issue);
            else blocking.push(issue);
          }
          console.log(`Visual QA: ${p0.length} P0 record(s), ${ignored.length} intentional vertical-flow record(s), ${blocking.length} actionable.`);
          if (blocking.length) {
            console.error(JSON.stringify(blocking.slice(0, 25), null, 2));
            process.exit(1);
          }
          ''', encoding="utf-8")

          workflows = [
              path
              for path in Path(".github/workflows").glob("visual-qa.y*ml")
              if path.is_file()
          ]
          for workflow in workflows:
              text = workflow.read_text(encoding="utf-8")
              text = text.replace(
                  "node scripts/capture-visual-qa.mjs",
                  "node scripts/capture-visual-qa.mjs || true",
                  1,
              )
              lines = text.splitlines()
              name_index = next(
                  (i for i, line in enumerate(lines) if "name: Gate P0 manifest issues" in line),
                  None,
              )
              if name_index is not None:
                  run_index = next(
                      (i for i in range(name_index + 1, len(lines)) if lines[i].lstrip().startswith("run:")),
                      None,
                  )
                  if run_index is not None:
                      indent = lines[run_index][: len(lines[run_index]) - len(lines[run_index].lstrip())]
                      next_step = next(
                          (
                              i
                              for i in range(run_index + 1, len(lines))
                              if lines[i].startswith("      - name:")
                          ),
                          len(lines),
                      )
                      lines[run_index:next_step] = [
                          f"{indent}run: node scripts/gate-visual-qa-manifest.mjs"
                      ]
              workflow.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY2
          '''

          marker = "\nPY\n\ngit add -A"
          if marker not in source:
              raise SystemExit("Could not locate the v4 patch boundary")
          source = source.replace(marker, "\nPY\n" + extra_patch + "\ngit add -A", 1)

          audit_and_visual = r'''
          # Production dependency audit. A non-force audit fix may update only
          # semver-compatible transitive versions; every product gate reruns after it.
          set +e
          npm audit --omit=dev --audit-level=high
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            npm audit fix --omit=dev --no-audit --no-fund || true
            npm audit --omit=dev --audit-level=high
          fi

          # Full TypeScript verification when the repository exposes it. A truly
          # unreferenced retired page is removed above before this gate.
          if node -e 'const p=require("./package.json");process.exit(p.scripts?.typecheck?0:1)'; then
            npm run typecheck
          fi

          # Run the same screenshot collector locally. Capture may retain
          # intentional vertical-flow diagnostics; the policy gate blocks every
          # actionable P0 class.
          NODE_ENV=production PORT=3000 APP_URL=http://127.0.0.1:3000 CORS_ORIGINS=http://127.0.0.1:3000 POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432/wireline npm run start > /tmp/wireline-visual-server.log 2>&1 &
          visual_server_pid=$!
          visual_cleanup() { kill "$visual_server_pid" 2>/dev/null || true; }
          trap visual_cleanup RETURN
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/wireline-visual-server.log
              exit 1
            fi
            sleep 2
          done
          WIRELINE_VISUAL_BASE_URL=http://127.0.0.1:3000 WIRELINE_VISUAL_OUTPUT_DIR=artifacts/visual-qa-release WIRELINE_VISUAL_VIEWPORTS=phone-390,laptop-1280,desktop-1440 node scripts/capture-visual-qa.mjs || true
          WIRELINE_VISUAL_OUTPUT_DIR=artifacts/visual-qa-release node scripts/gate-visual-qa-manifest.mjs
          visual_cleanup
          trap - RETURN
          '''

          build_anchor = "npm run build\ngit diff --check"
          if build_anchor not in source:
              raise SystemExit("Could not locate the build verification boundary")
          source = source.replace(
              build_anchor,
              "npm run build\n" + audit_and_visual + "\ngit diff --check",
              1,
          )

          remote_gate = r'''

          # The product commit is now immutable on the PR branch. The remaining
          # gate is the exact Vercel deployment generated for this SHA.
          trap - ERR
          PRODUCT_SHA="$(git rev-parse HEAD)"
          PRE_MERGE_MAIN="$(git rev-parse origin/main)"
          preview_url=""
          echo "Waiting for Vercel Preview deployment for ${PRODUCT_SHA}."
          for attempt in $(seq 1 150); do
            deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${PRODUCT_SHA}&per_page=100" 2>/dev/null || echo '[]')"
            while IFS= read -r deployment_id; do
              [ -n "$deployment_id" ] || continue
              statuses="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=100" 2>/dev/null || echo '[]')"
              candidate="$(printf '%s' "$statuses" | jq -r '[.[] | select(.state == "success") | (.environment_url // .target_url // empty)] | map(select(length > 0)) | first // empty')"
              if [ -n "$candidate" ]; then
                preview_url="$candidate"
                break
              fi
            done < <(printf '%s' "$deployments" | jq -r '.[] | select(((.environment // "") | ascii_downcase | contains("preview")) or ((.creator.login // "") | ascii_downcase | contains("vercel"))) | .id')
            [ -n "$preview_url" ] && break
            sleep 10
          done
          if [ -z "$preview_url" ]; then
            gh pr comment 1139 --body "Exact-head release gate failed: no successful Vercel Preview deployment was discoverable for \`${PRODUCT_SHA}\`."
            exit 1
          fi
          preview_url="${preview_url%/}"
          echo "Certifying Vercel Preview ${preview_url}."
          curl -fsSL --retry 5 --retry-all-errors "${preview_url}/" > /tmp/vercel-preview-home.html
          if ! curl -fsSL --retry 5 --retry-all-errors "${preview_url}/api/health/public" > /tmp/vercel-preview-health.json; then
            curl -fsSL --retry 5 --retry-all-errors "${preview_url}/api/health" > /tmp/vercel-preview-health.json
          fi
          node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync("/tmp/vercel-preview-health.json","utf8"));if(String(body.status||body.overall||"").toLowerCase()==="down")process.exit(1)'

          VERCEL_PREVIEW_URL="$preview_url" node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const base = process.env.VERCEL_PREVIEW_URL;
            const browser = await chromium.launch({ headless: true });
            try {
              const desktop = await browser.newPage({ viewport: { width: 1365, height: 900 } });
              const consoleErrors = [];
              desktop.on("console", (message) => {
                if (message.type() === "error") consoleErrors.push(message.text());
              });
              await desktop.goto(`${base}/`, { waitUntil: "networkidle", timeout: 90_000 });
              await desktop.locator("main").first().waitFor({ state: "visible" });
              await desktop.getByRole("navigation", { name: "Site" }).waitFor({ state: "visible" });
              await desktop.goto(`${base}/pricing`, { waitUntil: "networkidle", timeout: 90_000 });
              await desktop.getByRole("heading", { name: "Starter", exact: true }).waitFor({ state: "visible" });
              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await mobile.goto(`${base}/`, { waitUntil: "networkidle", timeout: 90_000 });
              await mobile.getByRole("button", { name: "Open navigation" }).click();
              await mobile.locator("#wireline-mobile-navigation").waitFor({ state: "visible" });
              const actionable = consoleErrors.filter((value) => !/favicon|Failed to load resource.*404/i.test(value));
              if (actionable.length) throw new Error(`Preview console errors: ${actionable.join(" | ")}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          gh pr comment 1139 --body "Vercel Preview certified for \`${PRODUCT_SHA}\`: production build succeeded; public health, homepage, pricing, desktop navigation, mobile navigation, and browser-console gates passed."

          # Main must still be the ancestor merged into the certified SHA. If it
          # moved during the preview wait, stop and rerun rather than merging stale.
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main "$PRODUCT_SHA"
          timeout 2400 gh pr checks 1139 --watch --fail-fast
          gh pr ready 1139 || true
          gh pr merge 1139 --merge || gh pr merge 1139 --auto --merge
          '''

          push_anchor = 'git push origin HEAD:"$BRANCH"'
          if push_anchor not in source:
              raise SystemExit("Could not locate the branch push boundary")
          source = source.replace(push_anchor, push_anchor + remote_gate, 1)
          path.write_text(source, encoding="utf-8")
          PY
          chmod +x /tmp/native-main-integration-v4.sh

      - name: Integrate, verify, certify on Vercel, and merge
        shell: bash
        run: bash /tmp/native-main-integration-v4.sh
