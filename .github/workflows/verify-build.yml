name: Verify build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Client and server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run design:check
      - run: npm run tsconfig:excludes:check
      - run: node apps/browser-extension/scripts/build.mjs --check
      - run: node apps/browser-extension/scripts/build.mjs
      - run: npm run build
      - run: npm run smoke:server
