name: Verify build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/openai-runtime-studio-integrations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Client and server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Print runner toolchain
        run: |
          node --version
          npm --version

      # package-lock is retained for local installs but has historical root-entry
      # drift. Install from package.json until its full regeneration lands.
      - name: Install dependencies
        run: npm install

      - name: Professional Heritage contract
        run: npm run active-surface:check

      - name: Build client and server
        run: npm run build

      - name: Smoke test bundled server
        run: node -e "process.env.VERCEL='1'; require('./dist/server.cjs'); console.log('server bundle imports')"
