name: Verify build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Client and server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # package-lock is retained for local installs but has historical root-entry
      # drift. Install from package.json until its full regeneration lands.
      - run: npm install
      - run: npm run active-surface:check
      - run: npm run tsconfig:excludes:check
      - run: node apps/browser-extension/scripts/build.mjs --check
      - run: node apps/browser-extension/scripts/build.mjs
      - run: npm run build
      - run: node -e "process.env.VERCEL='1'; require('./dist/server.cjs'); console.log('server bundle imports')"
        env:
          DATABASE_POOL_URL: postgresql://wireline:wireline@127.0.0.1:5432/wireline
