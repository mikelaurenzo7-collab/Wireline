name: Verify build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/openai-runtime-studio-integrations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Client and server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node -e "process.env.VERCEL='1'; require('./dist/server.cjs'); console.log('server bundle imports')"
