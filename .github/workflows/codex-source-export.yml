name: Codex source export

on:
  push:
    branches:
      - codex/launch-readiness-20260728

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export source
        uses: actions/upload-artifact@v4
        with:
          name: codex-source
          path: .
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
