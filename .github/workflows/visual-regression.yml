name: Visual regression

# Runs Playwright's `toHaveScreenshot()` against a Vercel preview URL on
# every pull request, blocking merge if the rendered UI diffs more than
# 0.2% from the committed baselines.
#
# Why this exists:
#   The "Aurora rail content-overlap" bug that shipped to production
#   in the May 2026 audit was a chrome regression — visible the moment
#   any operator opened the dashboard on lg+. No unit test could catch
#   it; only a pixel comparison would have. This workflow IS that pixel
#   comparison, wired to fail the PR check before promotion.
#
# How it works:
#   1. Wait for Vercel to publish the preview deployment for the PR.
#   2. Run `npm run test:visual` against that preview URL.
#   3. On diff, upload the failure artefacts (expected/actual/diff PNGs)
#      so the author can review without re-running locally.
#   4. To accept legitimate UI changes: run `npm run test:visual:update`
#      locally and commit the updated baselines under
#      `tests/visual/__snapshots__/`.

on:
  pull_request:
    branches: [main, master]
  # Also run on direct pushes to main so the baselines stay current
  # even when a change lands without a PR (rare on this repo).
  push:
    branches: [main, master]

jobs:
  visual:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # Wait for Vercel to publish the preview deploy for this PR. The
      # vercel-preview-url-action polls Vercel's deployment API until the
      # READY state is observed (or times out after 5 min).
      - name: Wait for Vercel preview
        if: github.event_name == 'pull_request'
        id: vercel-preview
        uses: zentered/vercel-preview-url@v1.1.9
        with:
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pick base URL
        id: base
        run: |
          if [ -n "${{ steps.vercel-preview.outputs.preview_url }}" ]; then
            echo "url=https://${{ steps.vercel-preview.outputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://trywireline.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual regression
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.base.outputs.url }}
          CI: "true"
        run: npm run test:visual

      - name: Upload diff artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
