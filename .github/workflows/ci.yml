name: CI

on:
  # Push runs are scoped to main only — feature branches are covered by the
  # pull_request trigger below, so we don't pay for the same commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a flurry of pushes to a PR
# (or to main) doesn't stack up billable Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit — fail on HIGH+ vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: node --max-old-space-size=4096 ./node_modules/typescript/bin/tsc --noEmit

      - name: Guard — user_id in service-role inserts
        run: node scripts/check-user-id-inserts.mjs

      - name: Lint
        run: npm run lint:eslint

      - name: Tests + coverage (enforces ratchet thresholds)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Docs and pricing drift check
        run: npm run docs:check

      - name: Strict Typecheck
        run: npm run lint:strict

      - name: Build
        run: npm run build

      - name: Smoke test (bundled server boots)
        run: npm run smoke:server

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Derive the Vercel preview URL from the branch name so e2e tests run
      # against a real deployment (with a live database) rather than a
      # no-DB local server. Branch slug rules: slashes → dashes, uppercase
      # → lowercase, non-alphanumeric → dashes.
      - name: Resolve Vercel preview URL
        id: preview
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          echo "url=https://wireline-git-${SLUG}-revaluate.vercel.app" >> "$GITHUB_OUTPUT"

      # Poll until the Vercel branch-alias URL responds 200. The e2e job runs
      # in parallel with Vercel's deployment pipeline; without this gate the
      # job can start before the preview is ready and hit a 404 or stale
      # deployment. 30 × 10 s = up to 5 min — plenty for a typical cold build.
      - name: Wait for Vercel preview to be ready
        run: |
          URL="${{ steps.preview.outputs.url }}"
          echo "Polling $URL …"
          for i in $(seq 1 30); do
            CODE=$(curl -s -L --max-time 15 -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "✓ Preview ready (attempt $i, HTTP $CODE)"
              exit 0
            fi
            echo "  Not ready yet — HTTP $CODE (attempt $i/30); retrying in 10 s"
            sleep 10
          done
          echo "✗ Preview did not become ready within 5 minutes"
          exit 1

      - name: Run E2E + accessibility tests
        # Scope to chromium — we only install one browser to keep CI fast and
        # cheap. Firefox/WebKit coverage can be added when we have time to
        # fund the extra minutes.
        # Point at the Vercel preview so tests that require a live database
        # (authenticated-dashboard, api-health) work correctly.
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
