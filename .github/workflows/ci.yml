name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          echo "Working directory: $(pwd)"
          echo "git: $(git --version)"
          echo "Files: $(ls -1 | head -20 | tr '\n' ' ')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node + npm versions
        run: |
          node --version
          npm --version
          echo "lockfileVersion: $(node -e 'console.log(require(\"./package-lock.json\").lockfileVersion)')"

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Dump npm logs on failure
        if: always() && steps.install.outcome == 'failure'
        run: |
          for f in $(ls -t ~/.npm/_logs/ 2>/dev/null | head -2); do
            echo "--- ~/.npm/_logs/$f ---"
            cat "$HOME/.npm/_logs/$f" || true
          done
          echo "Reachability:"
          curl -sS -o /dev/null -w "registry.npmjs.org: %{http_code} (%{time_total}s)\n" https://registry.npmjs.org/ || true

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Build (vite + esbuild server)
        run: npm run build

      - name: Server bootstrap smoke test
        run: npm run smoke:server

      - name: Production env check (informational)
        run: node scripts/check-prod-env.mjs || true

      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true
