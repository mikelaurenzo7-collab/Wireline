name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture diagnostics to file
        if: always()
        id: diag
        run: |
          {
            echo "## CI diagnostic dump"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Step outcomes (so far)"
            echo "- checkout: \`${{ steps.checkout.outcome }}\`"
            echo "- setup:    \`${{ steps.setup.outcome }}\`"
            echo ""
            echo "### Runner state"
            echo '```'
            echo "pwd: $(pwd)"
            echo "user: $(whoami)"
            echo "node: $(node --version 2>&1 || echo MISSING)"
            echo "npm:  $(npm --version 2>&1 || echo MISSING)"
            echo "lockfile present: $(test -f package-lock.json && echo YES || echo NO)"
            echo "lockfile version: $(node -p "require('./package-lock.json').lockfileVersion" 2>&1 || echo unreadable)"
            echo '```'
            echo ""
            echo "### Files"
            echo '```'
            ls -1 2>&1 | head -25
            echo '```'
            echo ""
            echo "### Network"
            echo '```'
            curl -sS -o /dev/null -w "registry.npmjs.org: HTTP %{http_code} in %{time_total}s\n" https://registry.npmjs.org/ 2>&1 || echo "curl failed"
            echo '```'
          } > /tmp/diag.md
          cat /tmp/diag.md

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          echo "exit=$?" > /tmp/npm-ci.exit

      - name: Append npm logs to diagnostic
        if: always()
        run: |
          {
            echo ""
            echo "### npm ci"
            echo "- outcome: \`${{ steps.install.outcome }}\`"
            echo ""
            echo "**stdout (last 80 lines):**"
            echo '```'
            tail -80 /tmp/npm-ci.log 2>/dev/null || echo "no stdout captured"
            echo '```'
            echo ""
            echo "**latest npm debug log:**"
            echo '```'
            latest=$(ls -t ~/.npm/_logs/ 2>/dev/null | head -1)
            if [ -n "$latest" ]; then
              tail -200 "$HOME/.npm/_logs/$latest" 2>/dev/null
            else
              echo "no ~/.npm/_logs/ entries"
            fi
            echo '```'
          } >> /tmp/diag.md

      - name: Post diagnostic as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/diag.md || echo "gh pr comment failed (non-fatal)"

      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm run test:run

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Smoke server
        id: smoke
        continue-on-error: true
        run: npm run smoke:server

      - name: Final summary + gate
        if: always()
        run: |
          echo "checkout:  ${{ steps.checkout.outcome }}"
          echo "setup:     ${{ steps.setup.outcome }}"
          echo "install:   ${{ steps.install.outcome }}"
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "tests:     ${{ steps.tests.outcome }}"
          echo "build:     ${{ steps.build.outcome }}"
          echo "smoke:     ${{ steps.smoke.outcome }}"
          for o in "${{ steps.checkout.outcome }}" "${{ steps.setup.outcome }}" "${{ steps.install.outcome }}" "${{ steps.typecheck.outcome }}" "${{ steps.tests.outcome }}" "${{ steps.build.outcome }}" "${{ steps.smoke.outcome }}"; do
            if [ "$o" = "failure" ]; then exit 1; fi
          done
