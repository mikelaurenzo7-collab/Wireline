name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Guard — user_id in service-role inserts
        run: node scripts/check-user-id-inserts.mjs

      - name: Lint
        run: npm run lint:eslint

      - name: Tests
        run: npm run test:run

      - name: Strict Typecheck
        run: npm run lint:strict

      - name: Build
        run: npm run build

      - name: Smoke test (bundled server boots)
        run: npm run smoke:server
