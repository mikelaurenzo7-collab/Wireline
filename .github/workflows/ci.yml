name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # See verify-build.yml: resolve packages from the active manifest while
      # historical root entries in package-lock are being retired.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: ESLint
        run: npm run lint:eslint

      - name: Professional Heritage contract
        run: npm run active-surface:check

      - name: tsconfig exclude hygiene
        run: npm run tsconfig:excludes:check

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test bundled server
        run: npm run smoke:server
