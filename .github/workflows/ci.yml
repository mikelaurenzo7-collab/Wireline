name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: ESLint
        run: npm run lint:eslint

      - name: Design system contract
        run: npm run design:check

      - name: tsconfig exclude hygiene
        run: npm run tsconfig:excludes:check

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test bundled server
        run: npm run smoke:server
