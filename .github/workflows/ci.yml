name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Guard — user_id in service-role inserts
        run: node scripts/check-user-id-inserts.mjs

      - name: Lint
        run: npm run lint:eslint

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Smoke test (bundled server boots)
        run: npm run smoke:server

      - name: Production env check
        # Without PRODUCTION_CHECK=1 the script exits 0 when only *recommended*
        # vars are missing (which is expected in CI where real secrets are absent).
        # It exits 1 on missing *required* vars — that failure is real and blocks.
        run: node scripts/check-prod-env.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET || 'placeholder' }}
