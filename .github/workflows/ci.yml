name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Release gate build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Print runner toolchain
        run: |
          node --version
          npm --version

      # See verify-build.yml: resolve packages from the active manifest while
      # historical root entries in package-lock are being retired.
      - name: Install dependencies
        run: npm install

      - name: Professional Heritage contract
        run: npm run active-surface:check

      - name: Type check
        run: npm run lint

      - name: Build client and server
        run: npm run build

      - name: Smoke test bundled server
        run: npm run smoke:server
