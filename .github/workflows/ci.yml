name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Cache npm separately from setup-node so a transient cache-service
      # hiccup doesn't abort the whole step. restore-keys lets us hydrate
      # from a close-enough cache when the lockfile hash changes.
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-npm-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Build (vite + esbuild server)
        run: npm run build

      - name: Server bootstrap smoke test
        # Catches ESM/CJS extension mismatches, top-level import crashes,
        # and missing-module errors that the bundler can't surface.
        # Spawns dist/server.cjs, verifies /api/health responds, kills it.
        run: npm run smoke:server

      - name: Production env check (informational)
        # Surfaces missing env vars in CI logs without blocking the build.
        # CI doesn't have prod secrets — the script exits 0 here so this
        # step is purely informational. The strict gate runs on release
        # tags via .github/workflows/prod-deploy-gate.yml using the
        # `production` GitHub environment, which DOES have prod secrets.
        run: node scripts/check-prod-env.mjs || true

      - name: Audit (high severity, blocking)
        # Hard fail on high-severity vulnerabilities so we don't ship
        # known-vulnerable dependencies. To temporarily allow a known
        # transitive vuln (with documented justification), add it to
        # `.npmaudit-allowlist.json` (see the file for format).
        run: node scripts/audit-blocking.mjs
