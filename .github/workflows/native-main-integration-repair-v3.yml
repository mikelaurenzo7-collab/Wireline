name: native-main-integration-repair-v3

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-main-integration-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: native-main-integration-repair-v2
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'audit-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run final integration repair and verification
        shell: bash
        env:
          HUSKY: "0"
          NODE_OPTIONS: "--max-old-space-size=6144"
          CI: "true"
        run: bash scripts/native-main-integrate-v3.sh
