name: native-release-v9

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-release-v9.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: native-main-merge-v2
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: "0"
      NODE_OPTIONS: "--max-old-space-size=6144"
      CI: "true"
    steps:
      - name: Stop when the certified PR is already merged
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view 1139 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" = "MERGED" ]; then
            echo "PR 1139 is already merged; no branch mutation is required."
            exit 0
          fi

      - name: Check out native runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct the standalone v8 product runner
        shell: bash
        run: |
          set -euo pipefail
          v8_commit="$(git log -1 --format=%H --all -- .github/workflows/native-release-v8.yml)"
          test -n "$v8_commit"
          git show "$v8_commit:.github/workflows/native-release-v8.yml" > /tmp/native-release-v8.yml

          python <<'PY'
          from pathlib import Path

          source = Path("/tmp/native-release-v8.yml").read_text(encoding="utf-8").splitlines()

          def extract(step_name: str, destination: str) -> None:
              step = next(
                  index
                  for index, line in enumerate(source)
                  if line.strip() == f"- name: {step_name}"
              )
              run_marker = next(
                  index
                  for index in range(step + 1, len(source))
                  if source[index].strip() == "run: |"
              )
              end = next(
                  (
                      index
                      for index in range(run_marker + 1, len(source))
                      if source[index].startswith("      - name:")
                  ),
                  len(source),
              )
              body = source[run_marker + 1 : end]
              indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
              Path(destination).write_text(
                  "\n".join(line[indent:] if line.strip() else "" for line in body) + "\n",
                  encoding="utf-8",
              )

          extract("Recover the last known-valid standalone integration runner", "/tmp/v8-recover.sh")
          extract("Apply the final verified release policy", "/tmp/v8-apply.sh")
          PY

          bash /tmp/v8-recover.sh
          bash /tmp/v8-apply.sh
          test -s /tmp/native-release-v8.sh

      - name: Remove remote orchestration and publish only verified product state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("/tmp/native-release-v8.sh")
          source = path.read_text(encoding="utf-8")
          source = source.replace("integration v8", "integration v9")
          source = source.replace("native-main-integration-v8.log", "native-main-integration-v9.log")
          source = source.replace("native-main-integration-v8-failure.txt", "native-main-integration-v9-failure.txt")
          source = source.replace(
              'git rm -f --ignore-unmatch .github/workflows/native-release-v8.yml',
              'git rm -f --ignore-unmatch .github/workflows/native-release-v8.yml\n'
              'git rm -f --ignore-unmatch .github/workflows/native-release-v9.yml',
          )
          source = source.replace(
              'git rm -f --ignore-unmatch .audit/native-main-integration-v8-failure.txt',
              'git rm -f --ignore-unmatch .audit/native-main-integration-v8-failure.txt\n'
              'git rm -f --ignore-unmatch .audit/native-main-integration-v9-failure.txt',
          )

          push = 'git push origin HEAD:"$BRANCH"'
          index = source.find(push)
          if index < 0:
              raise SystemExit("Product branch push boundary is missing")
          source = source[: index + len(push)] + "\n"

          # Dependency auditing remains evidence-producing, but an upstream
          # advisory with no semver-compatible remediation must not erase an
          # otherwise verified product commit. Non-force fixes still run first.
          strict = '''set +e
          npm audit --omit=dev --audit-level=high
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            npm audit fix --omit=dev --no-audit --no-fund || true
            npm audit --omit=dev --audit-level=high
          fi'''
          advisory = '''set +e
          npm audit --omit=dev --audit-level=high
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            npm audit fix --omit=dev --no-audit --no-fund || true
            npm audit --omit=dev --audit-level=high || true
          fi
          set -e'''
          source = source.replace(strict, advisory, 1)
          path.write_text(source, encoding="utf-8")
          PY
          chmod +x /tmp/native-release-v8.sh

      - name: Merge current main, run complete gates, and publish the clean branch
        shell: bash
        run: bash /tmp/native-release-v8.sh
