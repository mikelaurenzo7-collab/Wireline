name: Gitleaks Secret Scan

# Triggers temporarily reduced to manual-only (workflow_dispatch) while
# GitHub Actions billing is being sorted. Restore push/pull_request/schedule
# triggers once billing is current.
on:
  workflow_dispatch:

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gitleaks baseline can be configured via .gitleaks.toml
          # See https://github.com/gitleaks/gitleaks#configuration
