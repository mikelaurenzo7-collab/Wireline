name: Desktop native build

on:
  pull_request:
    paths:
      - "apps/desktop/native/**"
      - "apps/desktop/scripts/native-package-preflight.mjs"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.os }} helper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Windows SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"
      - name: macOS compiler version
        if: runner.os == 'macOS'
        run: xcrun swiftc --version
      - name: Compile native helper and verify provenance
        working-directory: apps/desktop
        run: |
          node native/build.mjs
          node --input-type=module -e "import { verifyNativePackage } from './scripts/native-package-preflight.mjs'; console.log(await verifyNativePackage(process.cwd(), process.platform, process.arch));"
      # This job does not launch the helper, capture windows, or send OS input.
      # A green compile does not certify permissions or user task completion.
