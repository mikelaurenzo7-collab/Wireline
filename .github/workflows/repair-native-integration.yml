name: repair-native-integration

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/repair-native-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct the public-demo contract path and retrigger integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          sed -i 's#tests/public-demo-fallback.spec.ts#tests/e2e/public-demo-fallback.spec.ts#g' .github/workflows/native-main-merge-diagnostic.yml
          git rm .github/workflows/repair-native-integration.yml
          git add .github/workflows/native-main-merge-diagnostic.yml
          git commit -m "ci(audit): correct native integration contract path"
          git push origin HEAD:"$GITHUB_REF_NAME"
