name: native-finalize-v7

on:
  push:
    branches:
      - cursor/native-xai-twilio-runtime-review-5789
    paths:
      - .github/workflows/native-finalize-v7.yml

permissions:
  checks: read
  contents: write
  deployments: read
  pull-requests: write
  statuses: read

concurrency:
  group: native-main-integration-repair-v2
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'audit-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      final_sha: ${{ steps.integrate.outputs.final_sha }}
    env:
      HUSKY: "0"
      NODE_OPTIONS: "--max-old-space-size=6144"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Produce the clean exact-head candidate
        id: integrate
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/native-finalize-v7.log) 2>&1
          git config user.name "Wireline Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          record_failure() {
            status=$?
            trap - ERR
            set +e
            git merge --abort >/dev/null 2>&1 || true
            git reset --hard "$GITHUB_SHA" >/dev/null 2>&1 || true
            mkdir -p .audit
            {
              echo "# Native exact-head integration failure"
              echo
              echo "HEAD=$GITHUB_SHA"
              echo "STATUS=$status"
              echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo '```text'
              tail -n 5000 /tmp/native-finalize-v7.log
              echo '```'
            } > .audit/native-finalize-v7-failure.txt
            git add .audit/native-finalize-v7-failure.txt
            git commit -m "chore(audit): record native exact-head integration failure" || true
            git push origin HEAD:"$GITHUB_REF_NAME" || true
            exit "$status"
          }
          trap record_failure ERR

          if [ -f scripts/native-main-integrate-v3.sh ]; then
            python <<'PY'
          from pathlib import Path

          path = Path("scripts/native-main-integrate-v3.sh")
          text = path.read_text(encoding="utf-8")
          repair = "python scripts/repair-native-main-integration.py\n"
          if "python scripts/native-main-postrepair-v5.py" not in text:
              if repair not in text:
                  raise SystemExit("base repair invocation not found")
              text = text.replace(repair, repair + "python scripts/native-main-postrepair-v5.py\n", 1)

          targeted = "npx playwright test \\\n"
          if "npx playwright install --with-deps chromium" not in text:
              if targeted not in text:
                  raise SystemExit("targeted browser gate not found")
              text = text.replace(targeted, "npx playwright install --with-deps chromium\n" + targeted, 1)

          cleanup = [
              "rm -f .github/workflows/native-main-integration-repair-v4.yml\n",
              "rm -f .github/workflows/native-main-integration-repair-v5.yml\n",
              "rm -f .github/workflows/native-finalize-v6.yml\n",
              "rm -f .github/workflows/native-finalize-v7.yml\n",
              "rm -f scripts/native-main-postrepair-v5.py\n",
              "rm -f .audit/native-main-integration-repair-v4-failure.txt\n",
              "rm -f .audit/native-main-integration-repair-v5-failure.txt\n",
              "rm -f .audit/native-finalize-v6-failure.txt\n",
              "rm -f .audit/native-finalize-v7-failure.txt\n",
          ]
          anchors = {
              ".github/": "rm -f .github/workflows/native-main-integration-repair-v3.yml\n",
              "scripts/": "rm -f scripts/native-main-integrate-v3.sh\n",
              ".audit/": "rm -f .audit/native-main-integration-repair-v3-failure.txt\n",
          }
          for line in cleanup:
              if line in text:
                  continue
              anchor = next(value for key, value in anchors.items() if key in line)
              if anchor not in text:
                  raise SystemExit(f"cleanup anchor missing for {line.strip()}")
              text = text.replace(anchor, anchor + line, 1)
          path.write_text(text, encoding="utf-8")
          PY
            bash scripts/native-main-integrate-v3.sh
          else
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Branch does not contain current origin/main." >&2
              exit 1
            fi
            npm ci --no-audit --no-fund
            set +e
            npm run authz:check
            authz_first=$?
            set -e
            if [ "$authz_first" -ne 0 ]; then
              echo "Authorization matrix regenerated; checking exact output."
            fi
            npm run authz:check
            npm run lint:server
            npm run lint:audit-modules
            npm run test:run
            npm run build
            npx playwright install --with-deps chromium
            npm run test:e2e
            npm audit --omit=dev --audit-level=high

            rm -f .github/workflows/native-finalize-v6.yml
            rm -f .github/workflows/native-finalize-v7.yml
            rm -f .audit/native-finalize-v6-failure.txt
            rm -f .audit/native-finalize-v7-failure.txt
            git add -A
            npm run source-control:check
            npm run workflow:syntax:check
            npm run docs:check
            git diff --check
            git commit -m "chore(audit): remove exact-head verification harness"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Final clean candidate: $final_sha"

  vercel:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for Vercel exact-head deployment
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ needs.integrate.outputs.final_sha }}'
          deadline=$((SECONDS + 2700))

          while [ "$SECONDS" -lt "$deadline" ]; do
            checks=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")
            statuses=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$sha/status")
            combined=$(jq -s '.[0] + {statuses: .[1].statuses}' \
              <(printf '%s' "$checks") <(printf '%s' "$statuses"))

            failed=$(printf '%s' "$combined" | jq '[
              (.check_runs[]? | select((.name | ascii_downcase | contains("vercel"))) | .conclusion),
              (.statuses[]? | select((.context | ascii_downcase | contains("vercel"))) | .state)
            ] | map(select(. != null and . != "success" and . != "neutral" and . != "skipped" and . != "pending" and . != "queued" and . != "in_progress")) | length')
            if [ "$failed" -gt 0 ]; then
              echo "Vercel reported a failed exact-head check for $sha." >&2
              exit 1
            fi

            count=$(printf '%s' "$combined" | jq '[
              (.check_runs[]? | select((.name | ascii_downcase | contains("vercel")))),
              (.statuses[]? | select((.context | ascii_downcase | contains("vercel"))))
            ] | length')
            pending=$(printf '%s' "$combined" | jq '[
              (.check_runs[]? | select((.name | ascii_downcase | contains("vercel")) and .status != "completed")),
              (.statuses[]? | select((.context | ascii_downcase | contains("vercel")) and .state == "pending"))
            ] | length')
            successful=$(printf '%s' "$combined" | jq '[
              (.check_runs[]? | select((.name | ascii_downcase | contains("vercel")) and .status == "completed" and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))),
              (.statuses[]? | select((.context | ascii_downcase | contains("vercel")) and .state == "success"))
            ] | length')

            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ] && [ "$successful" -eq "$count" ]; then
              printf '%s' "$combined" | jq -r '[
                (.check_runs[]? | select((.name | ascii_downcase | contains("vercel"))) | .details_url),
                (.statuses[]? | select((.context | ascii_downcase | contains("vercel"))) | .target_url)
              ] | map(select(. != null and . != "")) | unique[]'
              exit 0
            fi

            echo "Waiting for Vercel on $sha (found=$count pending=$pending successful=$successful)."
            sleep 20
          done

          echo "Vercel exact-head success was not observed before timeout." >&2
          exit 1

  visual_qa:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wireline
      WIRELINE_VISUAL_BASE_URL: http://127.0.0.1:3000
      WIRELINE_VISUAL_OUTPUT_DIR: artifacts/visual-qa-native-final
      WIRELINE_VISUAL_VIEWPORTS: phone-360,phone-390,tablet-768,laptop-1024,laptop-1280,desktop-1440
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.final_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture and gate the final marketing/workspace surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Server failed to start." >&2
              exit 1
            fi
            sleep 2
          done
          node scripts/capture-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wireline-native-final-visual-qa
          path: artifacts/visual-qa-native-final
          if-no-files-found: warn
          retention-days: 7

  android:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.final_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and test the Android client
        shell: bash
        run: |
          set -euo pipefail
          wrapper=$(find . -maxdepth 5 -type f -name gradlew -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$wrapper" ]; then
            echo "Android Gradle wrapper not found." >&2
            exit 1
          fi
          project_dir=$(dirname "$wrapper")
          cd "$project_dir"
          chmod +x ./gradlew
          ./gradlew --no-daemon test assembleDebug

  ios:
    needs: integrate
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.final_sha }}
      - name: Build the iOS client for Simulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find . -maxdepth 5 -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name Package.swift | head -n 1)" ]; then
            project_spec=$(find . -maxdepth 5 -type f -name project.yml -not -path '*/node_modules/*' | head -n 1)
            if [ -n "$project_spec" ]; then
              brew install xcodegen
              (cd "$(dirname "$project_spec")" && xcodegen generate)
            fi
          fi

          workspace=$(find . -maxdepth 6 -type d -name '*.xcworkspace' -not -path '*/Pods/*' -not -path '*/node_modules/*' | head -n 1)
          project=$(find . -maxdepth 6 -type d -name '*.xcodeproj' -not -path '*/Pods/*' -not -path '*/node_modules/*' | head -n 1)
          package=$(find . -maxdepth 6 -type f -name Package.swift -not -path '*/node_modules/*' | head -n 1)

          if [ -n "$workspace" ]; then
            listing=$(xcodebuild -list -json -workspace "$workspace")
            scheme=$(printf '%s' "$listing" | jq -r '.workspace.schemes[0] // empty')
            if [ -z "$scheme" ]; then
              echo "No shared scheme found in $workspace." >&2
              exit 1
            fi
            xcodebuild -workspace "$workspace" -scheme "$scheme" \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build
          elif [ -n "$project" ]; then
            listing=$(xcodebuild -list -json -project "$project")
            scheme=$(printf '%s' "$listing" | jq -r '.project.schemes[0] // empty')
            if [ -z "$scheme" ]; then
              echo "No shared scheme found in $project." >&2
              exit 1
            fi
            xcodebuild -project "$project" -scheme "$scheme" \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build
          elif [ -n "$package" ]; then
            (cd "$(dirname "$package")" && swift test)
          else
            echo "No iOS project, workspace, or Swift package found." >&2
            exit 1
          fi

  ready:
    needs: [integrate, vercel, visual_qa, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish verified exact-head status
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ needs.integrate.outputs.final_sha }}'
          gh pr ready 1139
          gh pr comment 1139 --body "Exact-head verification passed for \`$sha\`: full server/unit/build/browser gates, production-dependency audit, Vercel, visual QA, Android, and iOS Simulator. PR is ready for final merge review."
