<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0d2e"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0AC8D4"/>
      <stop offset="50%"  stop-color="#9B59F5"/>
      <stop offset="100%" stop-color="#E040C0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="200" cy="150" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0AC8D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0AC8D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1000" cy="500" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E040C0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E040C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logo-grad" cx="60" cy="60" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0AC8D4"/>
      <stop offset="50%"  stop-color="#9B59F5"/>
      <stop offset="100%" stop-color="#E040C0"/>
    </radialGradient>
  </defs>

  <!-- Background + aurora glows -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0"   y1="100" x2="1200" y2="100"/>
    <line x1="0"   y1="200" x2="1200" y2="200"/>
    <line x1="0"   y1="300" x2="1200" y2="300"/>
    <line x1="0"   y1="400" x2="1200" y2="400"/>
    <line x1="0"   y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0"   x2="200"  y2="630"/>
    <line x1="400" y1="0"   x2="400"  y2="630"/>
    <line x1="600" y1="0"   x2="600"  y2="630"/>
    <line x1="800" y1="0"   x2="800"  y2="630"/>
    <line x1="1000" y1="0"  x2="1000" y2="630"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80,90)">
    <rect width="100" height="100" rx="22" fill="url(#logo-grad)"/>
    <path d="M22 65 Q40 40 60 65 Q80 90 90 70" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M28 48 Q42 28 58 48 Q74 68 84 52" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M32 32 Q44 18 56 32 Q68 46 78 36" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="160" fill="white" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="64" letter-spacing="6">WIRELINE</text>
  <text x="212" y="195" fill="#9B59F5" font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="8">CARRIER-GRADE AI VOICE PLATFORM</text>

  <!-- Headline -->
  <text x="80" y="335" fill="url(#aurora)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="80" font-weight="400">AI agents that</text>
  <text x="80" y="425" fill="white" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="80" font-weight="400">close deals for you.</text>

  <!-- Subhead -->
  <text x="80" y="490" fill="#a0a0b8" font-family="Inter, system-ui, sans-serif" font-size="22">Voice + email autonomous agents · Powered by Claude Opus 4.7</text>

  <!-- Footer accent line -->
  <rect x="80" y="540" width="1040" height="2" fill="url(#aurora)" opacity="0.5"/>

  <!-- Footer chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="16" letter-spacing="4">
    <text x="80"  y="585" fill="#0AC8D4">VOICE</text>
    <text x="200" y="585" fill="#9B59F5">EMAIL</text>
    <text x="320" y="585" fill="#E040C0">INSIGHTS</text>
    <text x="500" y="585" fill="#10B981">TRIAGE</text>
    <text x="650" y="585" fill="#a0a0b8">wireline.app</text>
  </g>
</svg>
