<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#EFEAE0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="180" cy="120" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6B2B99" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6B2B99" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1050" cy="540" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6B2B99" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6B2B99" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Editorial warm-paper background with two soft silky-purple glows -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Brand mark — same canonical W as favicon, in silky purple -->
  <g transform="translate(80,80)">
    <rect width="128" height="128" rx="28" fill="#6B2B99"/>
    <path d="M 27.5 37.5 L 49 89 L 64 58.8 L 79 89 L 100.5 37.5"
          fill="none" stroke="#FFFFFF" stroke-width="13.75"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tag -->
  <text x="240" y="135" fill="#1C1917"
        font-family="Inter, system-ui, sans-serif"
        font-weight="800" font-size="56" letter-spacing="6">WIRELINE</text>
  <text x="242" y="172" fill="#7C7469"
        font-family="Inter, system-ui, sans-serif"
        font-size="14" letter-spacing="8">AI VOICE + EMAIL AGENTS</text>

  <!-- Editorial hero -->
  <text x="80" y="330" fill="#6B2B99"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="76" font-weight="400">AI agents for every</text>
  <text x="80" y="420" fill="#1C1917"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="76" font-weight="400">customer conversation.</text>

  <!-- Subhead — pure product framing, no partner verbiage -->
  <text x="80" y="485" fill="#5C5248"
        font-family="Inter, system-ui, sans-serif"
        font-size="22">14-day free trial · dedicated phone number included · cancel anytime</text>

  <!-- Footer hairline -->
  <rect x="80" y="540" width="1040" height="1.5" fill="#6B2B99" opacity="0.35"/>

  <!-- Partner logo strip — replaces the prior VOICE/EMAIL/INSIGHTS/TRIAGE chips
       AND the "Powered by Claude Opus 4.7" verbiage. Same marks the AuthPortal
       trust row carries: Anthropic · Vapi · ElevenLabs · Supabase · Vercel.
       Spaced evenly across the bottom, all in muted silky-purple so they
       read as a credibility strip not an ad. -->
  <g fill="#6B2B99" opacity="0.55">
    <!-- Anthropic mark — A glyph -->
    <g transform="translate(120, 570) scale(0.16)">
      <path d="M147.42 0h44.34l63.5 176h-44.34l-12.99-37.07h-65.5L119.43 176H75.09Zm-2.49 105.07h36.81l-18.4-52.45ZM0 176 63.5 0h44.34l-63.5 176Z"/>
    </g>
    <text x="190" y="595" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="600" letter-spacing="3">Anthropic</text>

    <!-- Vapi mark — bar-and-V combo -->
    <g transform="translate(370, 575) scale(1.3)">
      <rect x="0" y="4" width="3" height="16" rx="1"/>
      <rect x="6" y="8" width="3" height="12" rx="1"/>
      <rect x="12" y="2" width="3" height="20" rx="1"/>
      <rect x="18" y="6" width="3" height="14" rx="1"/>
    </g>
    <text x="408" y="595" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="600" letter-spacing="3">Vapi</text>

    <!-- ElevenLabs mark — two bars -->
    <g transform="translate(550, 575) scale(0.22)">
      <rect x="22" y="12" width="22" height="76" rx="2"/>
      <rect x="56" y="12" width="22" height="76" rx="2"/>
    </g>
    <text x="585" y="595" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="600" letter-spacing="3">ElevenLabs</text>

    <!-- Supabase mark — lightning bolt -->
    <g transform="translate(770, 572) scale(0.24)">
      <path d="M63.7 110.3c-2.8 3.6-8.7 1.6-8.6-3l1-69h47c8.6 0 13.3 9.8 8 16.5l-47.4 55.5Z"/>
      <path d="M45.3 2.6c2.9-3.6 8.7-1.6 8.7 3l-.4 69H7.1c-8.5 0-13.3-9.8-8-16.5L45.3 2.6Z"/>
    </g>
    <text x="804" y="595" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="600" letter-spacing="3">Supabase</text>

    <!-- Vercel mark — triangle -->
    <g transform="translate(990, 580) scale(0.12)">
      <path d="M113 0 226 200H0Z"/>
    </g>
    <text x="1024" y="595" font-family="Inter, system-ui, sans-serif" font-size="14"
          font-weight="600" letter-spacing="3">Vercel</text>
  </g>
</svg>
