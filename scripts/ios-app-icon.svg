      <stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="surface" cx="46%" cy="30%" r="76%">
      <stop offset="0" stop-color="#201B2B" stop-opacity="0.78"/>
      <stop offset="0.56" stop-color="#0E0D13" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#07070A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purple-down" x1="14" y1="14" x2="68" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8B5FF"/>
