[project]
name = "botbound-voice-engine"
version = "0.1.0"
description = "Private BotBound speech preview worker"
requires-python = ">=3.11,<3.12"
# Runtime imports only. Upstream Gradio/demo dependencies are intentionally omitted.
# Pinned upstream source archives install separately with --no-deps.
dependencies = [
  "torch==2.6.0+cpu",
  "torchaudio==2.6.0+cpu",
  "numpy==1.26.4",
  # ONNX 1.19 imports float4_e2m1fn but leaves ml-dtypes unconstrained upstream.
  "ml-dtypes==0.5.4",
  "librosa==0.11.0",
  "s3tokenizer==0.3.0",
  "transformers==5.2.0",
  "diffusers==0.29.0",
  "conformer==0.3.2",
  "safetensors==0.5.3",
  "spacy-pkuseg==1.0.1",
  "pykakasi==2.3.0",
  "pyloudnorm==0.2.0",
  "omegaconf==2.4.0",
  "pydub==0.25.1",
  "PyYAML==6.0.3",
  "soundfile==0.14.0",
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "uv_build==0.12.7",
]

[tool.uv]
# Keep universal OS resolution inside the one supported Python minor.
environments = ["python_version == '3.11'"]
