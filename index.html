    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wireline-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          // Dark is the first-visit WIRELINE appearance. Explicit Light and
          // System choices still apply before first paint to avoid theme flash.
          var useLight = stored === "light" || (stored === "system" && !systemDark);
          if (useLight) document.documentElement.classList.add("light");
        } catch (e) {
          /* Storage can be unavailable; dark remains the deterministic default. */
        }
      })();
    </script>

    <link rel="stylesheet" href="/app-shell.css" />

    <!-- Fonts are self-hosted (public/fonts.css + public/fonts/*.woff2), a
         verbatim mirror of the Google Fonts css2 response with the gstatic URLs
         rewritten. Previously this was a render-blocking cross-origin request
         chain (preconnect → Google CSS → gstatic woff2), which meant the entire
         WIRELINE identity degraded to system fonts whenever Google Fonts was
         slow, blocked by a privacy extension, or unreachable. First-party also
         removes the EU IP-disclosure question and lets the CSP drop both hosts. -->
    <link rel="preload" as="style" href="/fonts.css" />
    <link rel="stylesheet" href="/fonts.css" />

    <!-- Preload the three Latin faces every page actually renders with (Inter
         Tight display, Inter body, IBM Plex Mono labels). Without these the
         browser cannot discover a single woff2 until it has fetched AND parsed
         fonts.css, a serial hop that leaves brand text in the fallback face
         and forces a visible re-layout when the real font swaps in. Preloading
         starts them in parallel with the stylesheet instead. Keep this list to
         faces used above the fold: a preload that goes unused is wasted
         bandwidth and a console warning. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/NGSwv5HMAFg6IuGlBNMjxLsH8ag.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"

    <link

    <!--
      The Plausible stub queues every call in `plausible.q` and the real script
      flushes that queue on arrival, so the analytics bundle is injected
      dynamically (async) from /marketing-measurement.js instead of sitting here
      as a static tag.

      This is load-bearing, not cosmetic: a static `defer` script blocks
      DOMContentLoaded AND every deferred script after it, including the app's
      own module bundle. Whenever plausible.io was slow, blocked by an ad
      blocker that blackholes rather than refuses, or unreachable behind a
      corporate proxy, the whole site stayed blank until that connection timed
      out. Measured locally against a blocked host: FCP 12,936ms -> 280ms.
    -->
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>
    <script defer src="/marketing-measurement.js"></script>
