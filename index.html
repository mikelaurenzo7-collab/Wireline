<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ensures the page paints under iOS notches/Dynamic Island
         (we use env(safe-area-inset-*) in critical surfaces like the toast stack
         to keep tap targets out of the cutouts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS Safari from auto-linking phone numbers, emails, and dates.
         CRITICAL for this app — call logs contain thousands of phone numbers
         that should never be rendered as tappable tel: links.
         Each property is in its own tag for maximum compatibility. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />

    <!-- Primary meta — keywords-rich for B2B SaaS / AI agents search intent -->
    <title>Wireline — AI Voice &amp; Email Agents for Every Business · Call 24/7</title>
    <meta
      name="description"
      content="Deploy AI voice + email agents on real phone numbers in under 10 minutes. Wireline handles inbound calls, qualifies leads, books appointments, sends SMS follow-ups, and syncs with HubSpot, Salesforce, Gmail, and Outlook. Try a live demo agent now — no signup required."
    />
    <meta
      name="keywords"
      content="AI voice agent, AI receptionist, AI phone agent, voice AI for business, AI customer service, automated phone answering, AI SDR, AI appointment booking, AI sales agent, virtual receptionist, voice AI SaaS, business phone AI, 24/7 AI call handling"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Wireline" />
    <meta name="publisher" content="Wireline" />
    <meta name="theme-color" content="#4F1E7B" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F1E7B" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A0C42" />
    <meta name="msapplication-TileColor" content="#4F1E7B" />
    <meta name="apple-mobile-web-app-title" content="Wireline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="color-scheme" content="light" />

    <!-- Canonical — points to the live production URL (was wireline.app, now trywireline.com).
         Keeping this in sync with the served domain prevents SEO juice fragmentation. -->
    <link rel="canonical" href="https://trywireline.com/" />

    <!-- Plausible Analytics — privacy-first, no cookies, GDPR-clean
         out of the box. defer keeps it off the critical render path;
         data-domain matches whatever's configured in the Plausible
         dashboard. Sign up at plausible.io, add `trywireline.com`,
         done. If we ever switch hosts (self-host, fly.io, PostHog),
         just swap src + leave the existing custom events firing. -->
    <script
      defer
      data-domain="trywireline.com"
      src="https://plausible.io/js/script.tagged-events.js"
    ></script>
    <!-- Custom event helper. Calling plausible('SignupComplete') from
         anywhere in the app fires a tagged event so we can see funnel
         steps in the dashboard. Falls through silently if Plausible
         is blocked (some users have privacy extensions on). -->
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>

    <!-- Open Graph — how the site appears when shared on LinkedIn, Slack, FB, iMessage, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trywireline.com/" />
    <meta property="og:site_name" content="Wireline" />
    <meta property="og:title" content="Wireline — AI Voice &amp; Email Agents for Every Business" />
    <meta
      property="og:description"
      content="Deploy AI voice + email agents on real phone numbers in under 10 minutes. Call (630) 581-1834 right now to hear Liam answer in real time. "
    />
    <meta property="og:image" content="https://trywireline.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Wireline — AI voice and email agents for every business"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X — large-image card with full product framing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wirelineapp" />
    <meta name="twitter:creator" content="@wirelineapp" />
    <meta name="twitter:title" content="Wireline — AI Voice &amp; Email Agents · Try Live Now" />
    <meta
      name="twitter:description"
      content="AI agents on real phone numbers. Call (630) 581-1834 to hear it answer. Setup in 10 min. "
    />
    <meta name="twitter:image" content="https://trywireline.com/og-image.png" />
    <meta name="twitter:image:alt" content="Wireline AI voice agents" />

    <!-- JSON-LD: Organization + SoftwareApplication so Google can show
         rich result cards. Validated against schema.org and the Google
         Rich Results test. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://trywireline.com/#organization",
            "name": "Wireline",
            "legalName": "Wireline",
            "url": "https://trywireline.com/",
            "logo": "https://trywireline.com/wireline-icon-1024.png",
            "image": "https://trywireline.com/og-image.png",
            "description": "AI voice and email agents that deploy on real phone numbers for businesses.",
            "slogan": "AI voice and email agents on real phone numbers. Live in 10 minutes.",
            "foundingDate": "2024",
            "email": "trywireline@yahoo.com",
            "founder": {
              "@type": "Person",
              "name": "Michael Laurenzo",
              "jobTitle": "Founder",
              "url": "https://trywireline.com/about"
            },
            "sameAs": ["https://twitter.com/wirelineapp"],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "telephone": "+1-630-642-5661",
                "contactType": "customer support",
                "areaServed": "US",
                "availableLanguage": ["en"]
              },
              {
                "@type": "ContactPoint",
                "telephone": "+1-630-581-1834",
                "contactType": "sales",
                "areaServed": "US",
                "availableLanguage": ["en"]
              }
            ]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://trywireline.com/#software",
            "name": "Wireline",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://trywireline.com/",
            "description": "Deploy AI voice and email agents on real phone numbers. Handle inbound calls, qualify leads, book appointments, and sync with your CRM — all in under 10 minutes.",
            "offers": [
              {
                "@type": "Offer",
                "name": "Personal",
                "price": "49",
                "priceCurrency": "USD",
                "billingDuration": "P1M",
                "url": "https://trywireline.com/signup?plan=personal"
              },
              {
                "@type": "Offer",
                "name": "Starter",
                "price": "149",
                "priceCurrency": "USD",
                "billingDuration": "P1M",
                "url": "https://trywireline.com/signup?plan=starter"
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "499",
                "priceCurrency": "USD",
                "billingDuration": "P1M",
                "url": "https://trywireline.com/signup?plan=pro"
              },
              {
                "@type": "Offer",
                "name": "Business",
                "price": "1499",
                "priceCurrency": "USD",
                "billingDuration": "P1M",
                "url": "https://trywireline.com/signup?plan=business"
              }
            ],
            "publisher": { "@id": "https://trywireline.com/#organization" }
          },
          {
            "@type": "WebSite",
            "@id": "https://trywireline.com/#website",
            "url": "https://trywireline.com/",
            "name": "Wireline",
            "publisher": { "@id": "https://trywireline.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Preconnect to key origins for faster bootstrap.
         Google Fonts needs TWO origins: googleapis.com (CSS) + gstatic.com
         (WOFF2 files). Preconnect collapses 200-400ms of DNS+TLS on 4G.
         Plausible is preconnected because the analytics script ships from
         there and we want it ready before the bundle parses. Keep this
         list to browser-touched origins only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://plausible.io" crossorigin />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />
    <link rel="dns-prefetch" href="https://api.vapi.ai" />

    <!-- Favicons &amp; PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- mask-icon: Safari pinned-tab uses a single-color SVG. We reuse
         the favicon since the mark is already mono-stroke on a solid
         tile; the color attribute overrides the SVG fill in Safari. -->
    <link rel="mask-icon" href="/favicon.svg" color="#4F1E7B" />
    <!-- apple-touch-icon: iOS ignores the sizes attribute and uses the largest
         file it finds. The bare (no sizes) entry is the canonical default iOS
         will pick. Using the 1024px source — iOS applies its own rounded rect
         mask at the correct resolution. A 180px asset should be generated and
         referenced here once available. -->
    <link rel="apple-touch-icon" href="/wireline-icon-1024.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- humans.txt — credits, stack, and "who built this" -->
    <link rel="author" type="text/plain" href="/humans.txt" />

    <!-- Buffer polyfill: removed. The previous inline script was a no-op
         (calling Node's `require("buffer")` doesn't work in the browser)
         AND violated our CSP "script-src 'self'" directive on every page
         load. Vite bundles `globalThis.Buffer` via vite-plugin-node-polyfills
         where actually needed. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
