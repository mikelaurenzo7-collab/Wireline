    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wireline-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var useLight =
            stored === "light" || (stored !== "dark" && stored === "system" && !systemDark);
          if (useLight) document.documentElement.classList.add("light");
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
