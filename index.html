<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Wireline — AI Voice &amp; Email Agents for Your Business</title>
    <meta name="description" content="Wireline gives your business always-on AI voice and email agents. Handle inbound calls, qualify leads, book appointments, and follow up automatically — no code required." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.wireline.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.wireline.app/" />
    <meta property="og:site_name" content="Wireline" />
    <meta property="og:title" content="Wireline — AI Voice &amp; Email Agents for Your Business" />
    <meta property="og:description" content="Always-on AI agents that handle inbound calls, qualify leads, book appointments, and follow up automatically. Powered by Claude." />
    <!-- og:image: replace /og-image.png with your own 1200×630 PNG/JPG.
         Place the file in the public/ directory so Vite copies it to dist/. -->
    <meta property="og:image" content="https://www.wireline.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wireline — AI voice and email automation" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wirelineapp" />
    <meta name="twitter:title" content="Wireline — AI Voice &amp; Email Agents" />
    <meta name="twitter:description" content="Always-on AI agents that handle calls, qualify leads, and book appointments automatically." />
    <meta name="twitter:image" content="https://www.wireline.app/og-image.png" />

    <!-- Preconnect to key origins for faster API bootstrap -->
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />
    <link rel="dns-prefetch" href="https://api.vapi.ai" />

    <!-- Favicons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
