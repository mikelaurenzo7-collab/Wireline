<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ensures the page paints under iOS notches/Dynamic Island
         (we use env(safe-area-inset-*) in critical surfaces like the toast stack
         to keep tap targets out of the cutouts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS Safari from auto-linking phone numbers, emails, and dates.
         CRITICAL for this app — call logs contain thousands of phone numbers
         that should never be rendered as tappable tel: links.
         Each property is in its own tag for maximum compatibility. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />

    <!-- Primary meta — keywords-rich for B2B SaaS / AI agents search intent -->
    <title>Wireline — AI Voice &amp; Email Agents for Every Business · Call 24/7</title>
    <meta
      name="description"
      content="Deploy AI voice + email agents on real phone numbers in under 10 minutes. Wireline handles inbound calls, qualifies leads, books appointments, sends SMS follow-ups, and syncs with HubSpot, Salesforce, Gmail, and Outlook. Try a live demo agent now — no signup required."
    />
    <meta
      name="keywords"
      content="AI voice agent, AI receptionist, AI phone agent, voice AI for business, AI customer service, automated phone answering, AI SDR, AI appointment booking, AI sales agent, virtual receptionist, voice AI SaaS, business phone AI, 24/7 AI call handling"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Wireline" />
    <meta name="publisher" content="Wireline" />
    <meta name="theme-color" content="#8B3FD6" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#8B3FD6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A0C42" />
    <meta name="msapplication-TileColor" content="#8B3FD6" />
    <meta name="apple-mobile-web-app-title" content="Wireline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="color-scheme" content="light dark" />

    <!-- Canonical — points to the live production URL (was wireline.app, now trywireline.com).
         Keeping this in sync with the served domain prevents SEO juice fragmentation. -->
    <link rel="canonical" href="https://trywireline.com/" />

    <!-- Plausible Analytics — privacy-first, no cookies, GDPR-clean
         out of the box. defer keeps it off the critical render path;
         data-domain matches whatever's configured in the Plausible
         dashboard. Sign up at plausible.io, add `trywireline.com`,
         done. If we ever switch hosts (self-host, fly.io, PostHog),
         just swap src + leave the existing custom events firing. -->
    <script
      defer
      data-domain="trywireline.com"
      src="https://plausible.io/js/script.tagged-events.js"
    ></script>
    <!-- Custom event helper. Calling plausible('SignupComplete') from
         anywhere in the app fires a tagged event so we can see funnel
         steps in the dashboard. Falls through silently if Plausible
         is blocked (some users have privacy extensions on). -->
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>

    <!-- GTM & Meta Pixel (Production-only loader to prevent dev clutter) -->
    <script>
      (function() {
        var isProd = window.location.hostname === "trywireline.com" || window.location.hostname === "www.trywireline.com";
        if (isProd) {
          // Meta Pixel Code
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          
          fbq('init', '1683492795830248'); // Wireline Meta Pixel ID
          fbq('track', 'PageView');

          // Google Tag Manager Code
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-K2M2L84B'); // Wireline GTM Container ID
        } else {
          // Mock pixel for dev logs
          window.fbq = function(action, event, data) {
            console.log("[wireline:dev-pixel] fbq('" + action + "', '" + event + "')", data || "");
          };
          // Mock dataLayer for dev logs
          window.dataLayer = {
            push: function(data) {
              console.log("[wireline:dev-gtm] dataLayer.push()", data);
            }
          };
        }
      })();
    </script>

    <!-- Open Graph — how the site appears when shared on LinkedIn, Slack, FB, iMessage, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trywireline.com/" />
    <meta property="og:site_name" content="Wireline" />
    <meta property="og:title" content="Wireline — AI Voice &amp; Email Agents for Every Business" />
    <meta
      property="og:description"
      content="Deploy AI voice + email agents on real phone numbers in under 10 minutes. Call (630) 581-1834 right now to hear Liam answer in real time. "
    />
    <meta property="og:image" content="https://trywireline.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Wireline — AI voice and email agents for every business"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X — large-image card with full product framing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wirelineapp" />
    <meta name="twitter:creator" content="@wirelineapp" />
    <meta name="twitter:title" content="Wireline — AI Voice &amp; Email Agents · Try Live Now" />
    <meta
      name="twitter:description"
      content="AI agents on real phone numbers. Call (630) 581-1834 to hear it answer. Setup in 10 min. "
    />
    <meta name="twitter:image" content="https://trywireline.com/og-image.png" />
    <meta name="twitter:image:alt" content="Wireline AI voice agents" />

            "offers": [

    <!-- Preconnect to Google design resources and analytics. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://plausible.io" crossorigin />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />
    <link rel="dns-prefetch" href="https://api.vapi.ai" />

    <!-- Favicons &amp; PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- mask-icon: Safari pinned-tab uses a single-color SVG. We reuse
         the favicon since the mark is already mono-stroke on a solid
         tile; the color attribute overrides the SVG fill in Safari. -->
    <link rel="mask-icon" href="/favicon.svg" color="#8B3FD6" />
    <!-- apple-touch-icon: iOS uses this for the home-screen icon. The 180px
         PNG is generated at build time by scripts/render-image-assets.mjs
         from scripts/apple-touch-icon.svg — the exact resolution iOS wants,
         so it never has to downscale the 1024px source. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- humans.txt — credits, stack, and "who built this" -->
    <link rel="author" type="text/plain" href="/humans.txt" />

    <!-- Theme checker: executes synchronously before body render to prevent theme flashing -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('wireline.theme');
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Zero-Latency App Shell (Overwritten by React on mount) -->
      <style>
        body { margin: 0; background-color: #EFE9DC; font-family: system-ui, sans-serif; overflow: hidden; }
        .app-shell-skeleton { display: flex; height: 100vh; width: 100vw; background: #EFE9DC; }
        .shell-sidebar { width: 260px; background: #3b154c; border-right: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; padding: 24px; box-sizing: border-box; }
        .shell-logo { width: 120px; height: 24px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 40px; }
        .shell-nav-item { width: 100%; height: 32px; background: rgba(255,255,255,0.06); border-radius: 6px; margin-bottom: 12px; }
        .shell-main { flex: 1; display: flex; flex-direction: column; }
        .shell-header { height: 64px; border-bottom: 1px solid rgba(0,0,0,0.08); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
        .shell-title { width: 150px; height: 24px; background: rgba(0,0,0,0.05); border-radius: 4px; }
        .shell-content { flex: 1; padding: 32px; }
        .shell-card { width: 100%; height: 200px; background: rgba(239, 233, 220, 0.80); border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; margin-bottom: 24px; }
        
        /* Dark Mode Shell skeleton styling */
        .dark body { background-color: #09090b; }
        .dark .app-shell-skeleton { background: #09090b; }
        .dark .shell-sidebar { background: rgba(9, 9, 11, 0.95); border-right: 1px solid rgba(255,255,255,0.05); }
        .dark .shell-logo { background: rgba(255,255,255,0.05); }
        .dark .shell-nav-item { background: rgba(255,255,255,0.03); }
        .dark .shell-header { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dark .shell-title { background: rgba(255,255,255,0.03); }
        .dark .shell-card { background: rgba(9, 9, 11, 0.60); border: 1px solid rgba(255,255,255,0.03); }

        /* Pulse Animation */
        @keyframes shell-pulse { 0% { opacity: 0.6; } 50% { opacity: 0.3; } 100% { opacity: 0.6; } }
        .shell-logo, .shell-nav-item, .shell-title, .shell-card { animation: shell-pulse 2s infinite ease-in-out; }
        
        /* Mobile hidden sidebar */
        @media (max-width: 768px) { .shell-sidebar { display: none; } .shell-header { padding: 0 16px; } .shell-content { padding: 16px; } }
      </style>
      <div class="app-shell-skeleton">
        <div class="shell-sidebar">
          <div class="shell-logo"></div>
          <div class="shell-nav-item" style="opacity: 0.8"></div>
          <div class="shell-nav-item"></div>
          <div class="shell-nav-item"></div>
          <div class="shell-nav-item"></div>
        </div>
        <div class="shell-main">
          <div class="shell-header">
            <div class="shell-title"></div>
          </div>
          <div class="shell-content">
            <div class="shell-card"></div>
            <div class="shell-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
