# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# PROPOSAL: all four services use paid compute. Obtain plan/region approval
# before creating this Blueprint. It creates no database or other data store.
# Existing Supabase remains authoritative; there is no migration command.
#
# Release every service from the same reviewed commit on main. Auto-deploy is
# ON (autoDeployTrigger: commit) for the API and both crons: an independent
# full-diff review is the merge gate, and every merge to main ships to Render.
# botbound-voice is OFF: every deploy SIGTERMs the live worker and Render kills
# it 300s later, which would cut call control on any longer call. Release voice
# by pre-draining (below), then a manual deploy of the same commit. Release
# switches stay Dashboard-owned (sync: false); change them deliberately.
#
# IMPORT existing signing/encryption/provider values; do not rotate them during
# hosting migration. sync:false prompts only on first creation; later additions
# need manual Dashboard configuration. Optional providers may remain unset.
# No VERCEL*, VERCEL_TOKEN, or AI_GATEWAY_API_KEY values belong in this setup.
#
# Voice release: authenticated POST /drain on the OLD worker, then wait until
# authenticated GET /drain reports active=0 AND pending=0 BEFORE redeploying.
# node deploy/render/drain-voice.mjs performs that operation when explicitly run.
# Set VOICE_DRAIN_EXPECTED_REVISION to the old worker revision for that command.
# /livez stays healthy while draining; readiness/admission is a separate signal.
# maxShutdownDelaySeconds=300 is Render's maximum, not an hour-call guarantee.
# Do not use a preDeployCommand or autoscaling as a substitute for pre-drain.
# This single-voice-service proposal can pause new call admission during drain;
# seamless admission during release needs a separately verified blue/green pair.
#
# Render crons own scheduling (RENDER_CRON_ENABLED=true on both cron services).
# The legacy Vercel project's deployments are disabled; keep its crons off and
# never re-enable it while Render crons run. Never run both schedulers.
# Daily-brief claims do not expire on Render: inspect provider outcome before
# operator recovery, preserving dailyBriefLastAttemptAt.
# A cron HTTP timeout does not cancel API work.
#
# CERTIFIED PRODUCTION POSTURE (2026-10-24): the Render Dashboard is
# authoritative once this Blueprint has been synced. Release switches below are
# declared with `sync: false` so a Blueprint update cannot silently revert the
# certified posture. Certified values at that release:
#   BOTBOUND_TRAFFIC_ENABLED=true
#   BOTBOUND_NON_MARKETING_OUTBOUND_ENABLED=true
#   WIRELINE_SELF_SERVE_BILLING_ENABLED=true
#   WIRELINE_LAUNCH_DEMO_MODE=false
#   WIRELINE_AUTO_PROVISION_NUMBERS=true
#   WIRELINE_VOICE_WORKER_ADMISSIONS_ENABLED=true (after /readyz + real-call proof)
#   LAUNCH_HARD_GATE unset (launch readiness is 100)
#   RENDER_CRON_ENABLED=true on both cron services (Render owns scheduling)
# Auto-deploy is on from main for every service; QA re-runs after each deploy.
previews:
  generation: off

projects:
  - name: BotBound
    environments:
      - name: production
        envVarGroups:
          - name: botbound-runtime-config
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: "production"
              - key: HUSKY
                value: "0"
              # The release wrapper owns the exact npm ci; prevent an earlier
              # implicit install from changing the clean source lockfile.
              - key: SKIP_INSTALL_DEPS
                value: "true"
              - key: WIRELINE_DEPLOYMENT_ENVIRONMENT
                value: "production"
              - key: APP_URL
                value: "https://botbound.app"
              - key: CORS_ORIGINS
                value: "https://botbound.app"
              - key: TWILIO_WEBHOOK_BASE_URL
                value: "https://botbound.app"
              # Certified production: true (paid checkout open). Dashboard-owned
              # so a Blueprint sync cannot silently close or reopen billing.
              - key: WIRELINE_SELF_SERVE_BILLING_ENABLED
                sync: false
              # Certified production: false.
              - key: WIRELINE_LAUNCH_DEMO_MODE
                sync: false
              # Certified production leaves this unset (launch readiness is 100).
              - key: LAUNCH_HARD_GATE
                sync: false
              # Certified production: true.
              - key: WIRELINE_AUTO_PROVISION_NUMBERS
                sync: false
              - key: OPENAI_SIP_MAX_CALL_SECONDS
                value: "3600"
              - key: WIRELINE_OPENAI_REALTIME_SESSION_RESERVE_USD
                value: "1.00"
              - key: OPENAI_REALTIME_MODEL
                value: "gpt-realtime-2.1"
              - key: OPENAI_REALTIME_VOICE
