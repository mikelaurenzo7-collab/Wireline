          - type: cron
            name: botbound-jobs-sweep
            runtime: node
            region: ohio
            plan: 0.5c-512mb
            autoDeployTrigger: commit
            schedule: "* * * * *"
            buildCommand: node deploy/render/build.mjs jobs-sweep
            startCommand: node deploy/render/start.mjs jobs-sweep
            envVars:
              - key: SKIP_INSTALL_DEPS
                value: "true"
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: WIRELINE_DEPLOYMENT_ENVIRONMENT
                value: production
              # Certified production: true (Render owns scheduling).
              # Dashboard-owned; never enable while another scheduler runs.
              - key: RENDER_CRON_ENABLED
                sync: false
              - key: BOTBOUND_BACKEND_ORIGIN
                fromService:
                  name: botbound-api
                  type: web
                  envVarKey: BOTBOUND_BACKEND_ORIGIN
              - key: CRON_SECRET
                fromService:
                  name: botbound-api
                  type: web
                  envVarKey: CRON_SECRET

          - type: cron
            name: botbound-daily-brief
            runtime: node
            region: ohio
            plan: 0.5c-512mb
            autoDeployTrigger: commit
            schedule: "*/15 * * * *"
            buildCommand: node deploy/render/build.mjs daily-brief
            startCommand: node deploy/render/start.mjs daily-brief
            envVars:
              - key: SKIP_INSTALL_DEPS
