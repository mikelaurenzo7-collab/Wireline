# XcodeGen spec for the Wingman iOS app.
#
# Generate the Xcode project from this file (keeps a giant .pbxproj out of git
# and pins signing to YOUR Apple team):
#
#   brew install xcodegen      # one-time
#   cd ios && xcodegen generate
#   open Wingman.xcodeproj
#
# Then set your Development Team in Signing & Capabilities and run on a real
# device (PushKit VoIP needs hardware). Bump the deployment target if you like.
#
# NOTE: the CarPlay Communication entitlement
# (com.apple.developer.carplay-communication) is intentionally NOT in
# Wingman.entitlements — it must be granted by Apple before it can be signed,
# and including it un-granted breaks the build. Add it (and a CarPlay scene
# delegate) in Phase 2 once Apple approves the request.

name: Wingman
options:
  bundleIdPrefix: com.wireline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # ← set your 10-char Apple Team ID

targets:
  Wingman:
    type: application
    platform: iOS
    sources:
      - path: Wingman
      - path: WingmanShared # snapshot types shared with the widget extension
    dependencies:
      - target: WingmanWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireline.wingman
        PRODUCT_NAME: Wingman
        INFOPLIST_FILE: Wingman/Info.plist
        CODE_SIGN_ENTITLEMENTS: Wingman/Wingman.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1" # iPhone (CarPlay rides the phone target)
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  WingmanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WingmanWidgets
      - path: WingmanShared # same snapshot types, read-only in the extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireline.wingman.widgets
        PRODUCT_NAME: WingmanWidgets
        INFOPLIST_FILE: WingmanWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WingmanWidgets/WingmanWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
