# XcodeGen spec for the Wireline iOS app.
#
# Generate the Xcode project from this file (keeps a giant .pbxproj out of git
# and pins signing to YOUR Apple team):
#
#   brew install xcodegen      # one-time
#   cd ios && xcodegen generate
#   open Wireline.xcodeproj
#
# Then set your Development Team in Signing & Capabilities and run on a real
# device (PushKit VoIP needs hardware). Bump the deployment target if you like.
#
# NOTE: the CarPlay Communication entitlement
# (com.apple.developer.carplay-communication) is intentionally NOT in
# Wireline.entitlements — it must be granted by Apple before it can be signed,
# and including it un-granted breaks the build. Add it (and a CarPlay scene
# delegate) in Phase 2 once Apple approves the request.

name: Wireline
options:
  bundleIdPrefix: com.wireline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # ← set your 10-char Apple Team ID

targets:
  Wireline:
    type: application
    platform: iOS
    sources:
      - path: Wireline
      - path: WirelineShared
        excludes:
          # The app target owns its generated copy; widgets compile the shared copy.
          # Excluding this one prevents two WirelineDesignTokens declarations in Wireline.
          - WirelineDesignTokens.generated.swift
    dependencies:
      - target: WirelineWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireline.app
        PRODUCT_NAME: Wireline
        INFOPLIST_FILE: Wireline/Info.plist
        CODE_SIGN_ENTITLEMENTS: Wireline/Wireline.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # The app compiles, links, and bundles; the build then dies in
        # AppIntentsSSUTraining with "Unable to parse Info.plist". That step runs
        # appintentsnltrainingprocessor against the *built* Info.plist, which
        # infoPlistUtility writes as a binary plist by default. Emitting XML is
        # the one lever here that is a documented Xcode setting rather than a
        # guess, and it costs nothing at runtime. Treat this as a hypothesis CI
        # adjudicates, not a confirmed fix -- it has not been reproduced on a
        # macOS toolchain.
        INFOPLIST_OUTPUT_FORMAT: XML
        TARGETED_DEVICE_FAMILY: "1" # iPhone (CarPlay rides the phone target)
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  WirelineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WirelineWidgets
      - path: WirelineShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireline.app.widgets
        PRODUCT_NAME: WirelineWidgets
        INFOPLIST_FILE: WirelineWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
