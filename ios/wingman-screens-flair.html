<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wingman — Workspace + Calls (elevated SwiftUI preview)</title>
    <!-- Approximation of WorkspaceView + CallsView using the elevated
         BrandComponents (gradient button, specular/haloed medallion, live
         pulse, capsule tags). Mirrors the SwiftUI; real SF Pro differs. -->
    <style>
      :root { --purple:#8b3fd6; --purple-deep:#3b154c; --paper:#f5f1e8; --paper-warm:#ece6d9; --ink:#1a1614; --signal:#10b981;
        --font:-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif; }
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:var(--font);background:radial-gradient(900px 500px at 10% -10%,#2a2440,transparent 60%),#15131c;color:#e9e4f5;padding:40px 24px 64px}
      .wrap{max-width:760px;margin:0 auto}
      h1{font-size:24px;text-align:center;letter-spacing:-.02em}
      .sub{color:#b3aacb;text-align:center;font-size:14px;margin-top:6px}
      .frames{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin-top:30px}
      figure{width:300px}
      figcaption{text-align:center;color:#a99fc9;font-size:12.5px;margin-top:12px}
      .phone{width:300px;height:640px;border-radius:46px;padding:11px;background:linear-gradient(160deg,#2b2b30,#131316);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);position:relative}
      .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;position:relative}
      .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:27px;background:#000;border-radius:16px;z-index:30}
      .nav{padding:46px 18px 6px;display:flex;align-items:center;justify-content:space-between}
      .nav .ttl{font-size:26px;font-weight:700;letter-spacing:-.02em}
      .nav .ic{color:#6b6057}
      .body{flex:1;overflow:hidden;padding:6px 16px}
      /* elevated bits */
      .med{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;background:linear-gradient(150deg,var(--purple),var(--purple-deep));box-shadow:0 8px 16px -5px rgba(59,21,76,.4),inset 0 1px 0 rgba(255,255,255,.45)}
      .med.halo::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:var(--purple);opacity:.35;filter:blur(16px);z-index:-1;transform:scale(1.4)}
      .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;color:#fff;font-weight:600;font-size:16px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--purple-deep));box-shadow:0 14px 26px -8px rgba(139,63,214,.34),inset 0 0 0 .5px rgba(255,255,255,.18)}
      .card{background:var(--paper-warm);border:1px solid rgba(26,22,20,.06);border-radius:16px;box-shadow:0 8px 18px -10px rgba(26,22,20,.12);padding:13px;margin-top:12px}
      .row{display:flex;align-items:center;gap:12px}
      .nm{font-weight:600;font-size:15px}.rl{font-size:12px;color:#6b6057}
      .chips{margin-left:auto;color:var(--purple);font-size:14px;display:flex;gap:8px}
      .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8078;font-weight:700;margin:16px 4px 2px}
      .live{position:relative;width:12px;height:12px;display:inline-grid;place-items:center}
      .live .core{width:10px;height:10px;border-radius:50%;background:var(--signal)}
      .live .ring{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--signal);opacity:.55;animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
      @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
      .takebtn{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px}
      .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--purple);background:rgba(139,63,214,.1);padding:3px 8px;border-radius:999px}
      .empty{text-align:center;padding:22px 0}
      .empty .t{font-weight:600;font-size:17px;margin-top:12px}.empty .m{font-size:13px;color:#6b6057;margin-top:4px}
      .recent .row{padding:9px 0;border-bottom:1px solid rgba(26,22,20,.06)}
      .recent .row:last-child{border-bottom:0}
      .arrow{color:var(--purple);width:22px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Wingman — elevated screens</h1>
      <p class="sub">WorkspaceView + CallsView with the new primitives: gradient depth CTA, haloed medallion, premium cards, animated live pulse, capsule tags.</p>
      <div class="frames">
        <!-- Workspace -->
        <figure>
          <div class="phone"><div class="screen">
            <div class="island"></div>
            <div class="nav"><span class="ic">◑</span><span class="ttl">Wingman</span><span class="ic">📞</span></div>
            <div class="body">
              <div class="btn">🎙&nbsp; Ask Wingman</div>
              <div class="card row"><div class="med">◆</div><div><div class="nm">Acme Dental</div><div class="rl">Business · 2 of 3 agents</div></div></div>
              <div class="sec">Agents</div>
              <div class="card row"><div class="med" style="width:38px;height:38px;font-size:15px">☎</div><div><div class="nm">Ava</div><div class="rl">Customer Service</div></div><div class="chips">☎ ✉</div></div>
              <div class="card row"><div class="med" style="width:38px;height:38px;font-size:15px">↗</div><div><div class="nm">Morgan</div><div class="rl">Scheduler</div></div><div class="chips">☎</div></div>
              <div class="sec">&nbsp;</div>
              <div class="card row"><span style="color:var(--purple)">💳</span><div class="nm" style="font-weight:500">Wallet &amp; credits</div></div>
            </div>
          </div></div>
          <figcaption>Workspace — cards, haloed identity medallion, gradient CTA</figcaption>
        </figure>

        <!-- Calls -->
        <figure>
          <div class="phone"><div class="screen">
            <div class="island"></div>
            <div class="nav"><span></span><span class="ttl">Calls</span><span></span></div>
            <div class="body">
              <div class="sec">Live</div>
              <div class="card">
                <div class="row"><span class="live"><span class="ring"></span><span class="core"></span></span><div><div class="nm">+1 (312) 555-0188</div><div class="rl">In-progress</div></div><span style="margin-left:auto;color:var(--purple)">∿</span></div>
                <div class="takebtn">↙ Take this call</div>
              </div>
              <div class="sec">Recent</div>
              <div class="card recent">
                <div class="row"><span class="arrow">↗</span><div><div class="nm">Dr. Patel's office</div><div class="rl">Booked the 9:30 cleaning</div></div><span class="tag">Booked</span></div>
                <div class="row"><span class="arrow">↙</span><div><div class="nm">(312) 555-0188</div><div class="rl">Missed — left a message</div></div><span class="tag">Message</span></div>
                <div class="row"><span class="arrow">↗</span><div><div class="nm">Westside Pharmacy</div><div class="rl">Refill confirmed</div></div><span class="tag">Resolved</span></div>
              </div>
            </div>
          </div></div>
          <figcaption>Calls — live card with animated pulse, capsule outcome tags</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
